<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极客 · 俄罗斯方块 · cxy</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- 谷歌字体 JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" data-theme-icon />
    <script src="assets/theme.js"></script>
    <style>
        /* ---------- 全局重置 · 极客暗色 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace, system-ui, -apple-system, sans-serif;
            background: #0b0d12;
            background-image: radial-gradient(circle at 10% 20%, #13171f 0%, #080a0e 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.8rem;
            color: #d6e0f0;
        }

        /* ---------- 主卡片 ---------- */
        .card {
            max-width: 860px;
            width: 100%;
            background: rgba(12, 16, 24, 0.78);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius: 3.2rem;
            padding: 2.4rem 2.4rem 2.0rem;
            border: 1px solid rgba(var(--primary-rgb), 0.12);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(var(--primary-rgb), 0.05) inset;
            transition: box-shadow 0.3s ease, border-color 0.2s;
            text-align: center;
        }

        .card:hover {
            border-color: rgba(var(--primary-rgb), 0.25);
            box-shadow: 0 40px 80px -24px #000000, 0 0 0 1px rgba(var(--primary-rgb), 0.08) inset;
        }

        /* ----- 标题 & 导航 ----- */
        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-accent);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-title i {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .back-link {
            color: #6a9a8a;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border: 1px solid rgba(var(--primary-rgb), 0.08);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            transition: all 0.2s;
        }

        .back-link:hover {
            border-color: var(--primary);
            color: var(--text-accent);
            background: rgba(var(--primary-rgb), 0.04);
        }

        /* ----- 游戏区域 ----- */
        .game-wrapper {
            display: flex;
            gap: 1.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }

        .board-container {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 1.6rem;
            padding: 0.5rem;
            border: 1px solid rgba(var(--primary-rgb), 0.04);
        }

        #gameCanvas {
            display: block;
            background: #0b111a;
            border-radius: 1.2rem;
            image-rendering: pixelated;
            border: 1px solid rgba(var(--primary-rgb), 0.05);
            width: 300px;
            height: 600px;
        }

        /* 右侧信息面板 */
        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 140px;
            justify-content: flex-start;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 1.2rem;
            padding: 0.8rem 1.2rem;
            border: 1px solid rgba(var(--primary-rgb), 0.04);
            text-align: left;
        }

        .info-box .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .info-box .value {
            font-size: 1.4rem;
            font-weight: 600;
            color: #8cf0d0;
        }

        .info-box .value.score-value {
            color: #ffd866;
        }

        /* 预览方块 */
        .preview-container {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 1.2rem;
            padding: 0.8rem;
            border: 1px solid rgba(var(--primary-rgb), 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-container .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        #previewCanvas {
            display: block;
            background: #0b111a;
            border-radius: 0.8rem;
            image-rendering: pixelated;
            width: 100px;
            height: 100px;
            border: 1px solid rgba(var(--primary-rgb), 0.04);
        }

        /* ----- 控制区 ----- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 0.2rem;
        }

        .control-row {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(var(--primary-rgb), 0.08);
            color: #b0d0e8;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:hover {
            border-color: var(--primary);
            color: #e0f5f0;
            background: rgba(var(--primary-rgb), 0.04);
            box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.02);
        }

        .ctrl-btn i {
            color: #58d0b0;
        }

        .ctrl-btn.primary {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        .ctrl-btn.primary:hover {
            background: var(--primary);
            color: #0b0f18;
        }

        .ctrl-btn.primary:hover i {
            color: #0b0f18;
        }

        .ctrl-btn.danger {
            border-color: rgba(255, 100, 100, 0.15);
            color: #b08a8a;
        }

        .ctrl-btn.danger:hover {
            border-color: #ff6a6a;
            color: #ffb0b0;
            background: rgba(255, 80, 80, 0.04);
        }

        /* 移动端方向键 */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(3, 52px);
            gap: 5px;
            justify-content: center;
            margin: 0.4rem auto 0.2rem;
        }

        .dpad-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(var(--primary-rgb), 0.06);
            border-radius: 1rem;
            color: #b0d0e8;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            backdrop-filter: blur(4px);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active {
            background: rgba(var(--primary-rgb), 0.06);
            border-color: var(--primary);
            transform: scale(0.92);
        }

        .dpad-btn.empty {
            background: transparent;
            border: none;
            cursor: default;
            pointer-events: none;
        }

        .key-hint {
            font-size: 0.65rem;
            color: #4a6a6a;
            letter-spacing: 0.8px;
            margin-top: 0.3rem;
        }

        .key-hint kbd {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.1rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(var(--primary-rgb), 0.06);
            font-family: 'JetBrains Mono', monospace;
            color: #8aa8a0;
        }

        /* 状态消息 */
        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            margin-bottom: 1rem;
            border: 1px solid rgba(var(--primary-rgb), 0.04);
            font-size: 0.75rem;
            min-height: 2.4rem;
        }

        .status-message {
            color: #6a9a8a;
        }

        .status-message .highlight {
            color: var(--primary);
        }

        /* 装饰 */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(0deg, rgba(var(--primary-rgb), 0.01) 0px, rgba(0, 0, 0, 0.01) 2px, transparent 4px, transparent 6px);
            opacity: 0.15;
        }

        .glow-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 16px var(--primary);
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 700px) {
            .card {
                padding: 1.2rem 1rem;
                border-radius: 2rem;
            }

            .game-title {
                font-size: 1rem;
            }

            .game-wrapper {
                flex-direction: column;
                align-items: center;
            }

            #gameCanvas {
                width: 240px;
                height: 480px;
            }

            .info-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                min-width: unset;
            }

            .info-box {
                min-width: 80px;
                padding: 0.4rem 0.8rem;
            }

            .info-box .value {
                font-size: 1.1rem;
            }

            #previewCanvas {
                width: 80px;
                height: 80px;
            }

            .dpad {
                grid-template-columns: repeat(3, 44px);
                grid-template-rows: repeat(3, 44px);
                gap: 4px;
            }

            .dpad-btn {
                font-size: 0.9rem;
                border-radius: 0.8rem;
            }

            .ctrl-btn {
                font-size: 0.7rem;
                padding: 0.3rem 0.9rem;
            }
        }

        @media (max-width: 400px) {
            #gameCanvas {
                width: 200px;
                height: 400px;
            }

            .dpad {
                grid-template-columns: repeat(3, 38px);
                grid-template-rows: repeat(3, 38px);
                gap: 3px;
            }

            .dpad-btn {
                font-size: 0.8rem;
                border-radius: 0.6rem;
            }
        }
    </style>
</head>

<body>

    <div class="scanline" aria-hidden="true"></div>

    <main class="card">
        <!-- 头部 -->
        <div class="game-header">
            <div class="game-title">
                <i class="fas fa-cubes"></i> 俄罗斯方块 · <span style="color:#d6e8f0; font-weight:400;">cxy</span>
            </div>
            <a href="games.html" class="back-link" id="backLink"><i class="fas fa-arrow-left"></i> 返回</a>
            <div data-theme-switcher="compact"></div>
        </div>

        <!-- 状态 -->
        <div class="status-bar">
            <div class="status-message" id="statusMessage">
                <span class="glow-dot"></span> 按 <kbd>空格</kbd> 开始 / 暂停
            </div>
        </div>

        <!-- 游戏区域 -->
        <div class="game-wrapper">
            <div class="board-container">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
            </div>
            <div class="info-panel">
                <div class="info-box">
                    <div class="label">分数</div>
                    <div class="value score-value" id="scoreDisplay">0</div>
                </div>
                <div class="info-box">
                    <div class="label">行数</div>
                    <div class="value" id="linesDisplay">0</div>
                </div>
                <div class="info-box">
                    <div class="label">等级</div>
                    <div class="value" id="levelDisplay">1</div>
                </div>
                <div class="preview-container">
                    <div class="label">下一个</div>
                    <canvas id="previewCanvas" width="100" height="100"></canvas>
                </div>
            </div>
        </div>

        <!-- 控制区 -->
        <div class="controls">
            <div class="control-row">
                <button class="ctrl-btn primary" id="startBtn"><i class="fas fa-play"></i> 开始</button>
                <button class="ctrl-btn" id="pauseBtn"><i class="fas fa-pause"></i> 暂停</button>
                <button class="ctrl-btn danger" id="resetBtn"><i class="fas fa-undo-alt"></i> 重置</button>
            </div>

            <div class="dpad" id="dpad">
                <div class="dpad-btn empty"></div>
                <div class="dpad-btn" data-dir="rotate"><i class="fas fa-rotate-right"></i></div>
                <div class="dpad-btn empty"></div>

                <div class="dpad-btn" data-dir="left"><i class="fas fa-chevron-left"></i></div>
                <div class="dpad-btn" data-dir="drop"><i class="fas fa-arrow-down"></i></div>
                <div class="dpad-btn" data-dir="right"><i class="fas fa-chevron-right"></i></div>

                <div class="dpad-btn empty"></div>
                <div class="dpad-btn" data-dir="down"><i class="fas fa-chevron-down"></i></div>
                <div class="dpad-btn empty"></div>
            </div>

            <div class="key-hint">
                <kbd>←</kbd> <kbd>→</kbd> 移动 · <kbd>↑</kbd> 旋转 · <kbd>↓</kbd> 加速 · <kbd>空格</kbd> 硬降 · <kbd>P</kbd> 暂停
            </div>
        </div>
    </main>

    <script>
        // 主题色：由 assets/theme.js 维护当前值，换肤后 canvas 也跟着变色
        function TC() {
            return (window.GeekTheme && GeekTheme.colors()) ||
                { primary: '#00e5b0', dark: '#00b894', light: '#55efc4', rgb: '0, 255, 200' };
        }

        (function () {
            // ============================================================
            // 俄罗斯方块核心逻辑
            // ============================================================

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const previewCanvas = document.getElementById('previewCanvas');
            const previewCtx = previewCanvas.getContext('2d');

            const COLS = 10;
            const ROWS = 20;
            const BLOCK_SIZE = canvas.width / COLS;

            // ----- 方块定义 -----
            const SHAPES = {
                I: { blocks: [[1, 1, 1, 1]], color: TC().primary },
                O: { blocks: [[1, 1], [1, 1]], color: '#ffd866' },
                T: { blocks: [[0, 1, 0], [1, 1, 1]], color: '#b084e8' },
                S: { blocks: [[0, 1, 1], [1, 1, 0]], color: '#58d0b0' },
                Z: { blocks: [[1, 1, 0], [0, 1, 1]], color: '#ff6a6a' },
                J: { blocks: [[1, 0, 0], [1, 1, 1]], color: '#4a8ad6' },
                L: { blocks: [[0, 0, 1], [1, 1, 1]], color: '#f0a050' }
            };
            const SHAPE_NAMES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];

            // ----- 游戏状态 -----
            let board = [];
            let currentPiece = null;
            let nextPiece = null;
            let score = 0;
            let lines = 0;
            let level = 1;
            let gameOver = false;
            let paused = true;
            let gameInterval = null;
            let dropInterval = 500; // 毫秒

            // DOM 元素
            const scoreSpan = document.getElementById('scoreDisplay');
            const linesSpan = document.getElementById('linesDisplay');
            const levelSpan = document.getElementById('levelDisplay');
            const statusMsg = document.getElementById('statusMessage');

            // ----- 初始化 -----
            function initBoard() {
                board = [];
                for (let r = 0; r < ROWS; r++) {
                    board.push(new Array(COLS).fill(0));
                }
            }

            function randomPiece() {
                const name = SHAPE_NAMES[Math.floor(Math.random() * SHAPE_NAMES.length)];
                const shape = SHAPES[name];
                return {
                    name: name,
                    blocks: shape.blocks.map(row => [...row]),
                    color: shape.color,
                    x: Math.floor((COLS - shape.blocks[0].length) / 2),
                    y: 0,
                };
            }

            function spawnPiece() {
                if (nextPiece === null) {
                    nextPiece = randomPiece();
                }
                currentPiece = {
                    name: nextPiece.name,
                    blocks: nextPiece.blocks.map(row => [...row]),
                    color: nextPiece.color,
                    x: Math.floor((COLS - nextPiece.blocks[0].length) / 2),
                    y: 0,
                };
                nextPiece = randomPiece();

                // 检查是否碰撞 (game over)
                if (collision(currentPiece.blocks, currentPiece.x, currentPiece.y)) {
                    gameOver = true;
                    paused = true;
                    if (gameInterval) {
                        clearInterval(gameInterval);
                        gameInterval = null;
                    }
                    setStatus('💀 游戏结束 · 按「开始」重试', '#ff7a7a');
                }
                drawPreview();
                draw();
            }

            // ----- 碰撞检测 -----
            function collision(blocks, offsetX, offsetY) {
                for (let r = 0; r < blocks.length; r++) {
                    for (let c = 0; c < blocks[r].length; c++) {
                        if (blocks[r][c]) {
                            const boardX = offsetX + c;
                            const boardY = offsetY + r;
                            if (boardX < 0 || boardX >= COLS || boardY >= ROWS || boardY < 0) {
                                return true;
                            }
                            if (boardY >= 0 && board[boardY][boardX] !== 0) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            // ----- 固定当前方块到面板 -----
            function lockPiece() {
                if (!currentPiece) return;
                const { blocks, x, y, color } = currentPiece;
                for (let r = 0; r < blocks.length; r++) {
                    for (let c = 0; c < blocks[r].length; c++) {
                        if (blocks[r][c]) {
                            const boardX = x + c;
                            const boardY = y + r;
                            if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                                board[boardY][boardX] = color;
                            }
                        }
                    }
                }

                // 消除满行
                clearLines();

                // 生成下一个方块
                spawnPiece();
                draw();
            }

            // ----- 消除行 -----
            function clearLines() {
                let cleared = 0;
                for (let r = ROWS - 1; r >= 0;) {
                    if (board[r].every(cell => cell !== 0)) {
                        board.splice(r, 1);
                        board.unshift(new Array(COLS).fill(0));
                        cleared++;
                        // 继续检查同一行
                    } else {
                        r--;
                    }
                }

                if (cleared > 0) {
                    lines += cleared;
                    // 计分规则：1行100，2行300，3行500，4行800
                    const points = [0, 100, 300, 500, 800];
                    score += points[cleared] * level;
                    level = Math.floor(lines / 10) + 1;
                    dropInterval = Math.max(80, 500 - (level - 1) * 40);
                    updateInfo();
                    // 重置计时器
                    if (!paused && !gameOver) {
                        if (gameInterval) {
                            clearInterval(gameInterval);
                            gameInterval = null;
                        }
                        gameInterval = setInterval(drop, dropInterval);
                    }
                }
            }

            // ----- 移动 -----
            function movePiece(dx, dy) {
                if (!currentPiece || paused || gameOver) return false;
                const newX = currentPiece.x + dx;
                const newY = currentPiece.y + dy;
                if (!collision(currentPiece.blocks, newX, newY)) {
                    currentPiece.x = newX;
                    currentPiece.y = newY;
                    draw();
                    return true;
                }
                // 如果是向下移动失败 (dy === 1)，锁定方块
                if (dy === 1) {
                    lockPiece();
                    draw();
                    return false;
                }
                return false;
            }

            // ----- 旋转 -----
            function rotatePiece() {
                if (!currentPiece || paused || gameOver) return;
                const blocks = currentPiece.blocks;
                const rotated = [];
                for (let c = 0; c < blocks[0].length; c++) {
                    rotated.push([]);
                    for (let r = blocks.length - 1; r >= 0; r--) {
                        rotated[c].push(blocks[r][c]);
                    }
                }
                // 踢墙检查
                const kicks = [0, -1, 1, -2, 2];
                for (const kick of kicks) {
                    if (!collision(rotated, currentPiece.x + kick, currentPiece.y)) {
                        currentPiece.blocks = rotated;
                        currentPiece.x += kick;
                        draw();
                        return;
                    }
                }
            }

            // ----- 硬降 -----
            function hardDrop() {
                if (!currentPiece || paused || gameOver) return;
                while (!collision(currentPiece.blocks, currentPiece.x, currentPiece.y + 1)) {
                    currentPiece.y++;
                }
                lockPiece();
                draw();
            }

            // ----- 下落 (由定时器触发) -----
            function drop() {
                if (paused || gameOver || !currentPiece) return;
                if (!collision(currentPiece.blocks, currentPiece.x, currentPiece.y + 1)) {
                    currentPiece.y++;
                    draw();
                } else {
                    lockPiece();
                    draw();
                }
            }

            // ----- 绘制 -----
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 绘制网格
                ctx.strokeStyle = `rgba(${TC().rgb}, 0.02)`;
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= COLS; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * BLOCK_SIZE, 0);
                    ctx.lineTo(i * BLOCK_SIZE, canvas.height);
                    ctx.stroke();
                }
                for (let i = 0; i <= ROWS; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, i * BLOCK_SIZE);
                    ctx.lineTo(canvas.width, i * BLOCK_SIZE);
                    ctx.stroke();
                }

                // 绘制已固定的方块
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c] !== 0) {
                            const x = c * BLOCK_SIZE;
                            const y = r * BLOCK_SIZE;
                            ctx.shadowColor = `rgba(${TC().rgb}, 0.05)`;
                            ctx.shadowBlur = 6;
                            ctx.fillStyle = board[r][c];
                            ctx.beginPath();
                            ctx.roundRect(x + 1, y + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2, 3);
                            ctx.fill();
                            // 高光
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = 'rgba(255,255,255,0.04)';
                            ctx.beginPath();
                            ctx.roundRect(x + 3, y + 2, BLOCK_SIZE - 10, 3, 2);
                            ctx.fill();
                        }
                    }
                }
                ctx.shadowBlur = 0;

                // 绘制当前方块
                if (currentPiece && !gameOver) {
                    const { blocks, x, y, color } = currentPiece;
                    for (let r = 0; r < blocks.length; r++) {
                        for (let c = 0; c < blocks[r].length; c++) {
                            if (blocks[r][c]) {
                                const boardX = (x + c) * BLOCK_SIZE;
                                const boardY = (y + r) * BLOCK_SIZE;
                                ctx.shadowColor = `rgba(${TC().rgb}, 0.15)`;
                                ctx.shadowBlur = 10;
                                ctx.fillStyle = color;
                                ctx.beginPath();
                                ctx.roundRect(boardX + 1, boardY + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2, 3);
                                ctx.fill();
                                ctx.shadowBlur = 0;
                                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                                ctx.beginPath();
                                ctx.roundRect(boardX + 3, boardY + 2, BLOCK_SIZE - 10, 3, 2);
                                ctx.fill();
                            }
                        }
                    }
                    ctx.shadowBlur = 0;
                }

                // Game Over 覆盖层
                if (gameOver) {
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.font = '24px JetBrains Mono, monospace';
                    ctx.fillStyle = '#ff7a7a';
                    ctx.shadowColor = 'rgba(255,100,100,0.2)';
                    ctx.shadowBlur = 20;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                    ctx.shadowBlur = 0;
                }
            }

            // 预览绘制
            function drawPreview() {
                previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                if (!nextPiece) return;
                const blocks = nextPiece.blocks;
                const color = nextPiece.color;
                const size = previewCanvas.width / 4;
                const offsetX = (previewCanvas.width - blocks[0].length * size) / 2;
                const offsetY = (previewCanvas.height - blocks.length * size) / 2;
                for (let r = 0; r < blocks.length; r++) {
                    for (let c = 0; c < blocks[r].length; c++) {
                        if (blocks[r][c]) {
                            const x = offsetX + c * size;
                            const y = offsetY + r * size;
                            previewCtx.fillStyle = color;
                            previewCtx.shadowColor = `rgba(${TC().rgb}, 0.1)`;
                            previewCtx.shadowBlur = 8;
                            previewCtx.beginPath();
                            previewCtx.roundRect(x + 1, y + 1, size - 2, size - 2, 3);
                            previewCtx.fill();
                            previewCtx.shadowBlur = 0;
                        }
                    }
                }
            }

            // roundRect 辅助
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };

            // ----- 更新信息 -----
            function updateInfo() {
                scoreSpan.textContent = score;
                linesSpan.textContent = lines;
                levelSpan.textContent = level;
            }

            function setStatus(text, color = '#6a9a8a') {
                statusMsg.innerHTML = `<span class="glow-dot"></span> ${text}`;
                statusMsg.style.color = color;
            }

            // ----- 游戏控制 -----
            function startGame() {
                if (gameOver) {
                    resetGame();
                    setTimeout(() => startGame(), 50);
                    return;
                }
                if (paused) {
                    paused = false;
                    if (gameInterval) clearInterval(gameInterval);
                    gameInterval = setInterval(drop, dropInterval);
                    setStatus('▶ 游戏中...', '#8cf0d0');
                    draw();
                }
            }

            function pauseGame() {
                if (gameOver) return;
                if (!paused) {
                    paused = true;
                    if (gameInterval) {
                        clearInterval(gameInterval);
                        gameInterval = null;
                    }
                    setStatus('⏸ 已暂停 · 按 <kbd>空格</kbd> 继续', '#6a9a8a');
                } else {
                    startGame();
                }
            }

            function resetGame() {
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                initBoard();
                score = 0;
                lines = 0;
                level = 1;
                dropInterval = 500;
                gameOver = false;
                paused = true;
                nextPiece = randomPiece();
                spawnPiece();
                updateInfo();
                setStatus('已重置 · 按 <kbd>空格</kbd> 开始', '#6a9a8a');
                draw();
                drawPreview();
            }

            // ----- 键盘事件 -----
            document.addEventListener('keydown', (e) => {
                const key = e.key;
                const controlKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'p', 'P'];
                if (controlKeys.includes(key)) {
                    e.preventDefault();
                }

                if (key === ' ') {
                    if (gameOver) {
                        startGame();
                    } else {
                        pauseGame();
                    }
                    return;
                }

                if (key === 'p' || key === 'P') {
                    pauseGame();
                    return;
                }

                if (paused || gameOver) return;

                switch (key) {
                    case 'ArrowLeft': movePiece(-1, 0); break;
                    case 'ArrowRight': movePiece(1, 0); break;
                    case 'ArrowDown': movePiece(0, 1); break;
                    case 'ArrowUp': rotatePiece(); break;
                }
            });

            // ----- 按钮事件 -----
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('pauseBtn').addEventListener('click', pauseGame);
            document.getElementById('resetBtn').addEventListener('click', resetGame);

            // 方向键 (触屏)
            document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dir = btn.getAttribute('data-dir');
                    if (paused || gameOver) return;
                    switch (dir) {
                        case 'left': movePiece(-1, 0); break;
                        case 'right': movePiece(1, 0); break;
                        case 'down': movePiece(0, 1); break;
                        case 'rotate': rotatePiece(); break;
                        case 'drop': hardDrop(); break;
                    }
                });
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const dir = btn.getAttribute('data-dir');
                    if (paused || gameOver) return;
                    switch (dir) {
                        case 'left': movePiece(-1, 0); break;
                        case 'right': movePiece(1, 0); break;
                        case 'down': movePiece(0, 1); break;
                        case 'rotate': rotatePiece(); break;
                        case 'drop': hardDrop(); break;
                    }
                });
            });

            // 返回按钮
            document.getElementById('backLink').addEventListener('click', (e) => {
                e.preventDefault();
                if (confirm('退出游戏？进度将丢失。')) {
                    if (gameInterval) {
                        clearInterval(gameInterval);
                        gameInterval = null;
                    }
                    window.location.href = 'index.html';
                }
            });

            // ----- 启动 -----
            initBoard();
            nextPiece = randomPiece();
            spawnPiece();
            updateInfo();
            setStatus('按 <kbd>空格</kbd> 开始', '#6a9a8a');
            draw();
            drawPreview();
        })();
    </script>

</body>

</html>
