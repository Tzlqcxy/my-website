<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极客 · 贪吃蛇 · cxy</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- 谷歌字体 JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" data-theme-icon />
    <script src="assets/theme.js"></script>
    <script src="assets/scores.js"></script>
    <style>
        /* ---------- 全局重置 · 极客暗色 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace, system-ui, -apple-system, sans-serif;
            background: #0b0d12;
            background-image: radial-gradient(circle at 10% 20%, #13171f 0%, #080a0e 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.8rem;
            color: #d6e0f0;
        }

        /* ---------- 主卡片 ---------- */
        .card {
            max-width: 780px;
            width: 100%;
            background: rgba(12, 16, 24, 0.78);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius: 3.2rem;
            padding: 2.4rem 2.4rem 2.0rem;
            border: 1px solid rgba(var(--primary-rgb), 0.12);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(var(--primary-rgb), 0.05) inset;
            transition: box-shadow 0.3s ease, border-color 0.2s;
            text-align: center;
        }

        .card:hover {
            border-color: rgba(var(--primary-rgb), 0.25);
            box-shadow: 0 40px 80px -24px #000000, 0 0 0 1px rgba(var(--primary-rgb), 0.08) inset;
        }

        /* ----- 标题 & 导航 ----- */
        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-accent);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-title i {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .back-link {
            color: #6a9a8a;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border: 1px solid rgba(var(--primary-rgb), 0.08);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            transition: all 0.2s;
        }

        .back-link:hover {
            border-color: var(--primary);
            color: var(--text-accent);
            background: rgba(var(--primary-rgb), 0.04);
        }

        /* ----- 游戏状态栏 ----- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(var(--primary-rgb), 0.04);
            font-size: 0.8rem;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .score {
            color: #8cf0d0;
        }
        .score span {
            color: #d6e8f0;
            font-weight: 600;
        }

        .status-message {
            color: #6a9a8a;
        }
        .status-message .highlight {
            color: var(--primary);
        }

        /* ----- 游戏画布 ----- */
        .canvas-wrapper {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 2rem;
            padding: 0.5rem;
            border: 1px solid rgba(var(--primary-rgb), 0.04);
            margin-bottom: 1.2rem;
            position: relative;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            aspect-ratio: 1/1;
            background: #0b111a;
            border-radius: 1.6rem;
            image-rendering: pixelated;
            border: 1px solid rgba(var(--primary-rgb), 0.05);
        }

        /* ----- 控制区 (键盘 + 按钮) ----- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 0.2rem;
        }

        .control-row {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(var(--primary-rgb), 0.08);
            color: #b0d0e8;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:hover {
            border-color: var(--primary);
            color: #e0f5f0;
            background: rgba(var(--primary-rgb), 0.04);
            box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.02);
        }

        .ctrl-btn i {
            color: #58d0b0;
        }

        .ctrl-btn.primary {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        .ctrl-btn.primary:hover {
            background: var(--primary);
            color: #0b0f18;
        }
        .ctrl-btn.primary:hover i {
            color: #0b0f18;
        }

        .ctrl-btn.danger {
            border-color: rgba(255, 100, 100, 0.15);
            color: #b08a8a;
        }
        .ctrl-btn.danger:hover {
            border-color: #ff6a6a;
            color: #ffb0b0;
            background: rgba(255, 80, 80, 0.04);
        }

        /* 移动端方向键 (仿摇杆) */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 56px);
            gap: 6px;
            justify-content: center;
            margin: 0.4rem auto 0.2rem;
        }

        .dpad-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(var(--primary-rgb), 0.06);
            border-radius: 1rem;
            color: #b0d0e8;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            backdrop-filter: blur(4px);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active {
            background: rgba(var(--primary-rgb), 0.06);
            border-color: var(--primary);
            transform: scale(0.92);
        }

        .dpad-btn.empty {
            background: transparent;
            border: none;
            cursor: default;
            pointer-events: none;
        }

        /* 键盘提示 */
        .key-hint {
            font-size: 0.65rem;
            color: #4a6a6a;
            letter-spacing: 0.8px;
            margin-top: 0.3rem;
        }

        .key-hint kbd {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.1rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(var(--primary-rgb), 0.06);
            font-family: 'JetBrains Mono', monospace;
            color: #8aa8a0;
        }

        /* 装饰 */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(0deg, rgba(var(--primary-rgb), 0.01) 0px, rgba(0, 0, 0, 0.01) 2px, transparent 4px, transparent 6px);
            opacity: 0.15;
        }

        .glow-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 16px var(--primary);
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 600px) {
            .card {
                padding: 1.2rem 1rem;
                border-radius: 2rem;
            }
            .game-title {
                font-size: 1rem;
            }
            .status-bar {
                font-size: 0.7rem;
                padding: 0.4rem 0.8rem;
            }
            .dpad {
                grid-template-columns: repeat(3, 46px);
                grid-template-rows: repeat(3, 46px);
                gap: 5px;
            }
            .dpad-btn {
                font-size: 1rem;
                border-radius: 0.8rem;
            }
            .ctrl-btn {
                font-size: 0.7rem;
                padding: 0.3rem 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .dpad {
                grid-template-columns: repeat(3, 38px);
                grid-template-rows: repeat(3, 38px);
                gap: 4px;
            }
            .dpad-btn {
                font-size: 0.8rem;
                border-radius: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="scanline" aria-hidden="true"></div>

    <main class="card">
        <!-- 头部 -->
        <div class="game-header">
            <div class="game-title">
                <i class="fas fa-gamepad"></i> 贪吃蛇 · <span style="color:#d6e8f0; font-weight:400;">cxy</span>
            </div>
            <a href="#" class="back-link" id="backLink"><i class="fas fa-arrow-left"></i> 返回</a>
            <div data-theme-switcher="compact"></div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="score"><i class="fas fa-star" style="color:var(--primary); margin-right:4px;"></i> 分数 <span id="scoreDisplay">0</span></div>
            <div class="status-message" id="statusMessage">
                <span class="glow-dot"></span> 按 <kbd>空格</kbd> 开始 / 暂停
            </div>
        </div>

        <!-- 画布 -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <!-- 控制区 -->
        <div class="controls">
            <!-- 桌面按钮 -->
            <div class="control-row">
                <button class="ctrl-btn primary" id="startBtn"><i class="fas fa-play"></i> 开始</button>
                <button class="ctrl-btn" id="pauseBtn"><i class="fas fa-pause"></i> 暂停</button>
                <button class="ctrl-btn danger" id="resetBtn"><i class="fas fa-undo-alt"></i> 重置</button>
            </div>

            <!-- 方向键 (触屏/鼠标) -->
            <div class="dpad" id="dpad">
                <div class="dpad-btn empty"></div>
                <div class="dpad-btn" data-dir="up"><i class="fas fa-chevron-up"></i></div>
                <div class="dpad-btn empty"></div>

                <div class="dpad-btn" data-dir="left"><i class="fas fa-chevron-left"></i></div>
                <div class="dpad-btn empty"></div>
                <div class="dpad-btn" data-dir="right"><i class="fas fa-chevron-right"></i></div>

                <div class="dpad-btn empty"></div>
                <div class="dpad-btn" data-dir="down"><i class="fas fa-chevron-down"></i></div>
                <div class="dpad-btn empty"></div>
            </div>

            <div class="key-hint">
                <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制 · <kbd>空格</kbd> 暂停
            </div>
        </div>

        <div class="cloud-rank" data-cloud-rank="snake"></div>
    </main>

    <script>
        // 主题色：由 assets/theme.js 维护当前值，换肤后 canvas 也跟着变色
        function TC() {
            return (window.GeekTheme && GeekTheme.colors()) ||
                { primary: '#00e5b0', dark: '#00b894', light: '#55efc4', rgb: '0, 255, 200' };
        }

        (function() {
            // ---------- 游戏核心 ----------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // 网格配置 (20x20)
            const GRID_SIZE = 20;
            const TILE_COUNT = 20;
            const TILE_SIZE = canvas.width / TILE_COUNT;

            // 状态
            let snake = [];
            let food = { x: 8, y: 10 };
            let direction = 'right';
            let nextDirection = 'right';
            let score = 0;
            let gameOver = false;
            let win = false;
            let paused = true; // 默认暂停 (等待开始)
            let gameInterval = null;
            const MOVE_INTERVAL = 150; // 毫秒

            // DOM 元素
            const scoreSpan = document.getElementById('scoreDisplay');
            const statusMsg = document.getElementById('statusMessage');

            // ---------- 初始化 ----------
            function initGame() {
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 },
                    { x: 7, y: 10 }
                ];
                direction = 'right';
                nextDirection = 'right';
                score = 0;
                gameOver = false;
                win = false;
                paused = true;
                clearInterval(gameInterval);
                gameInterval = null;
                generateFood();
                updateScore();
                setStatus('按 <kbd>空格</kbd> 开始', '#6a9a8a');
                draw();
            }

            // 生成食物 (避开蛇身)
            function generateFood() {
                const maxAttempts = 1000;
                for (let i = 0; i < maxAttempts; i++) {
                    const fx = Math.floor(Math.random() * TILE_COUNT);
                    const fy = Math.floor(Math.random() * TILE_COUNT);
                    if (!snake.some(seg => seg.x === fx && seg.y === fy)) {
                        food = { x: fx, y: fy };
                        return;
                    }
                }
                // 如果蛇几乎占满，检查是否胜利
                if (snake.length >= TILE_COUNT * TILE_COUNT) {
                    win = true;
                    gameOver = true;
                    paused = true;
                    clearInterval(gameInterval);
                    gameInterval = null;
                    setStatus('✨ 你赢了！ 完美通关', '#8cf0d0');
                }
            }

            // ---------- 游戏循环 ----------
            function move() {
                if (paused || gameOver) return;

                // 应用有效方向
                const opposite = {
                    'up': 'down',
                    'down': 'up',
                    'left': 'right',
                    'right': 'left'
                };
                if (nextDirection && opposite[nextDirection] !== direction) {
                    direction = nextDirection;
                }

                const head = { ...snake[0] };
                switch (direction) {
                    case 'right': head.x++; break;
                    case 'left': head.x--; break;
                    case 'up': head.y--; break;
                    case 'down': head.y++; break;
                    default: return;
                }

                // 检测是否吃到食物
                const isEating = (head.x === food.x && head.y === food.y);

                // 构建新蛇
                let newSnake = [head, ...snake];
                if (!isEating) {
                    newSnake.pop();
                }

                // 碰撞检测 (边界 & 自身)
                const headCollision =
                    head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT ||
                    newSnake.slice(1).some(seg => seg.x === head.x && seg.y === head.y);

                if (headCollision) {
                    gameOver = true;
                    paused = true;
                    clearInterval(gameInterval);
                    gameInterval = null;
                    setStatus('💀 游戏结束 · 按「开始」重试', '#ff7a7a');
                    if (window.GameScores) GameScores.submit('snake', score, '长度 ' + snake.length);
                    draw();
                    return;
                }

                snake = newSnake;

                if (isEating) {
                    score++;
                    updateScore();
                    generateFood();
                    // 胜利检测在 generateFood 中处理
                    if (win) {
                        gameOver = true;
                        paused = true;
                        clearInterval(gameInterval);
                        gameInterval = null;
                        setStatus('✨ 你赢了！ 完美通关', '#8cf0d0');
                        if (window.GameScores) GameScores.submit('snake', score, '通关');
                        draw();
                        return;
                    }
                }

                draw();
            }

            // ---------- 绘制 ----------
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 绘制网格 (极暗线)
                ctx.strokeStyle = `rgba(${TC().rgb}, 0.02)`;
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= TILE_COUNT; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * TILE_SIZE, 0);
                    ctx.lineTo(i * TILE_SIZE, canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * TILE_SIZE);
                    ctx.lineTo(canvas.width, i * TILE_SIZE);
                    ctx.stroke();
                }

                // 绘制蛇
                snake.forEach((seg, index) => {
                    const isHead = index === 0;
                    const x = seg.x * TILE_SIZE;
                    const y = seg.y * TILE_SIZE;
                    const padding = isHead ? 1 : 2;
                    const radius = isHead ? 4 : 3;

                    ctx.shadowColor = isHead ? `rgba(${TC().rgb}, 0.3)` : `rgba(${TC().rgb}, 0.05)`;
                    ctx.shadowBlur = isHead ? 12 : 4;

                    ctx.fillStyle = isHead ? '#8cf0d0' : '#3a7a6a';
                    ctx.beginPath();
                    ctx.roundRect(x + padding, y + padding, TILE_SIZE - padding * 2, TILE_SIZE - padding * 2, radius);
                    ctx.fill();

                    // 头部高光
                    if (isHead) {
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = 'rgba(255,255,255,0.06)';
                        ctx.beginPath();
                        ctx.roundRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6, 3);
                        ctx.fill();
                    }
                });
                ctx.shadowBlur = 0;

                // 绘制食物 (发光)
                const fx = food.x * TILE_SIZE;
                const fy = food.y * TILE_SIZE;
                const glow = ctx.createRadialGradient(
                    fx + TILE_SIZE / 2, fy + TILE_SIZE / 2, 2,
                    fx + TILE_SIZE / 2, fy + TILE_SIZE / 2, TILE_SIZE
                );
                glow.addColorStop(0, 'rgba(255, 120, 80, 0.9)');
                glow.addColorStop(0.4, 'rgba(255, 80, 40, 0.6)');
                glow.addColorStop(1, 'rgba(255, 80, 40, 0)');
                ctx.fillStyle = glow;
                ctx.fillRect(fx - 4, fy - 4, TILE_SIZE + 8, TILE_SIZE + 8);

                ctx.shadowColor = 'rgba(255, 120, 80, 0.5)';
                ctx.shadowBlur = 16;
                ctx.fillStyle = '#ff6a3a';
                ctx.beginPath();
                ctx.roundRect(fx + 3, fy + 3, TILE_SIZE - 6, TILE_SIZE - 6, 6);
                ctx.fill();
                ctx.shadowBlur = 0;

                // 内高光
                ctx.fillStyle = 'rgba(255,200,180,0.15)';
                ctx.beginPath();
                ctx.roundRect(fx + 5, fy + 4, TILE_SIZE - 10, 4, 2);
                ctx.fill();

                // 如果游戏结束且未胜利，覆盖一层暗色
                if (gameOver && !win) {
                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.font = '24px JetBrains Mono, monospace';
                    ctx.fillStyle = '#ff7a7a';
                    ctx.shadowColor = 'rgba(255,100,100,0.2)';
                    ctx.shadowBlur = 20;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                    ctx.shadowBlur = 0;
                } else if (win) {
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.font = '24px JetBrains Mono, monospace';
                    ctx.fillStyle = '#8cf0d0';
                    ctx.shadowColor = `rgba(${TC().rgb}, 0.2)`;
                    ctx.shadowBlur = 20;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('✨ VICTORY ✨', canvas.width / 2, canvas.height / 2);
                    ctx.shadowBlur = 0;
                }
            }

            // roundRect 辅助
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };

            // ---------- 辅助函数 ----------
            function updateScore() {
                scoreSpan.textContent = score;
            }

            function setStatus(text, color = '#6a9a8a') {
                statusMsg.innerHTML = `<span class="glow-dot"></span> ${text}`;
                statusMsg.style.color = color;
            }

            // ---------- 控制函数 ----------
            function startGame() {
                if (gameOver || win) {
                    initGame();
                    // 重新初始化后，再开始
                    setTimeout(() => {
                        paused = false;
                        if (gameInterval) clearInterval(gameInterval);
                        gameInterval = setInterval(move, MOVE_INTERVAL);
                        setStatus('▶ 游戏中...', '#8cf0d0');
                        draw();
                    }, 50);
                    return;
                }
                if (paused) {
                    paused = false;
                    if (gameInterval) clearInterval(gameInterval);
                    gameInterval = setInterval(move, MOVE_INTERVAL);
                    setStatus('▶ 游戏中...', '#8cf0d0');
                    draw();
                }
            }

            function pauseGame() {
                if (gameOver || win) return;
                if (!paused) {
                    paused = true;
                    if (gameInterval) {
                        clearInterval(gameInterval);
                        gameInterval = null;
                    }
                    setStatus('⏸ 已暂停 · 按 <kbd>空格</kbd> 继续', '#6a9a8a');
                } else {
                    startGame();
                }
            }

            function resetGame() {
                clearInterval(gameInterval);
                gameInterval = null;
                initGame();
                // 重置后保持暂停
                paused = true;
                setStatus('已重置 · 按 <kbd>空格</kbd> 开始', '#6a9a8a');
                draw();
            }

            function changeDirection(newDir) {
                if (paused || gameOver) return;
                const opposite = {
                    'up': 'down',
                    'down': 'up',
                    'left': 'right',
                    'right': 'left'
                };
                if (newDir !== opposite[direction]) {
                    nextDirection = newDir;
                }
            }

            // ---------- 事件绑定 ----------
            // 键盘
            document.addEventListener('keydown', (e) => {
                const key = e.key;
                // 防止页面滚动 / 默认行为
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) {
                    e.preventDefault();
                }

                if (key === ' ') {
                    if (gameOver || win) {
                        startGame();
                    } else {
                        pauseGame();
                    }
                    return;
                }

                const dirMap = {
                    'ArrowUp': 'up',
                    'w': 'up',
                    'W': 'up',
                    'ArrowDown': 'down',
                    's': 'down',
                    'S': 'down',
                    'ArrowLeft': 'left',
                    'a': 'left',
                    'A': 'left',
                    'ArrowRight': 'right',
                    'd': 'right',
                    'D': 'right'
                };
                if (dirMap[key]) {
                    changeDirection(dirMap[key]);
                }
            });

            // 按钮
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('pauseBtn').addEventListener('click', pauseGame);
            document.getElementById('resetBtn').addEventListener('click', resetGame);

            // 方向键 (触屏/鼠标)
            document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dir = btn.getAttribute('data-dir');
                    changeDirection(dir);
                });
                // 移动端 touch 防止页面滚动
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const dir = btn.getAttribute('data-dir');
                    changeDirection(dir);
                });
            });

            // 返回按钮 (保留)
            document.getElementById('backLink').addEventListener('click', (e) => {
                e.preventDefault();
                if (confirm('退出游戏？进度将丢失。')) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                    window.history.back();
                }
            });

            // ---------- 启动 ----------
            initGame();
        })();
    </script>

</body>
</html>
