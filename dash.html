<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insight Dash · 数据仪表盘</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --primary: #00e5b0;
            --primary-dark: #00b894;
            --primary-light: #55efc4;
            --primary-glow: rgba(0, 255, 200, 0.25);
            --primary-border: rgba(0, 255, 200, 0.12);
            --primary-border-hover: rgba(0, 255, 200, 0.25);
            --text-primary: #d6e0f0;
            --text-accent: #b0f0e0;
            --text-secondary: #6a8e8a;
            --text-muted: #4a7a7a;
            --bg-body: #0b0d12;
            --bg-card: rgba(12, 16, 24, 0.78);
            --bg-input: rgba(0, 0, 0, 0.3);
            --border-color: rgba(0, 255, 200, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'JetBrains Mono', monospace;
            background: var(--bg-body);
            background-image: radial-gradient(circle at 10% 20%, #13171f 0%, #080a0e 90%);
            min-height: 100vh;
            padding: 2rem;
            color: var(--text-primary);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0 2rem;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header h1 i {
            color: var(--primary);
            margin-right: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .refresh-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .refresh-btn:hover {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        .refresh-btn i {
            margin-right: 4px;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.3rem 1.2rem;
            border: 1px solid var(--primary-border);
            border-radius: 30px;
            transition: 0.2s;
        }

        .back-link:hover {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        /* ===== 统计卡片 ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1.4rem;
            padding: 1.2rem 1.5rem;
            text-align: center;
            transition: 0.3s;
        }

        .stat-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .stat-card .number {
            font-size: 2.4rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary-light);
        }

        .stat-card .label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.2rem;
        }

        .stat-card .icon {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 0.2rem;
        }

        /* ===== 图表区 ===== */
        .charts-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .chart-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1.4rem;
            padding: 1.5rem;
        }

        .chart-box .title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-box .title i {
            color: var(--primary);
        }

        /* 排行榜（简化版） */
        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.3rem 0.6rem;
            border-radius: 0.6rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            transition: 0.2s;
        }

        .rank-item:hover {
            border-color: var(--primary);
        }

        .rank-item .pos {
            width: 24px;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
        }

        .rank-item .name {
            flex: 1;
            font-size: 0.8rem;
            color: var(--text-accent);
        }

        .rank-item .wpm {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }

        .rank-item .bar {
            width: 60px;
            height: 4px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .rank-item .bar .fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
        }

        /* ===== 留言动态 ===== */
        .message-feed {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 280px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .message-feed::-webkit-scrollbar {
            width: 3px;
        }

        .message-feed::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .feed-item {
            padding: 0.4rem 0.6rem;
            border-radius: 0.6rem;
            background: var(--bg-input);
            border-left: 2px solid var(--primary);
            font-size: 0.8rem;
        }

        .feed-item .author {
            color: var(--text-accent);
            font-weight: 500;
        }

        .feed-item .time {
            font-size: 0.55rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-left: 6px;
        }

        .feed-item .text {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-top: 0.1rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.3rem;
            }

            .charts-row {
                grid-template-columns: 1fr;
            }

            .stat-card .number {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }

            .header-right {
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> Insight Dash</h1>
            <div class="header-right">
                <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> 刷新</button>
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回</a>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="icon"><i class="fas fa-users"></i></div>
                <div class="number" id="totalPlayers">--</div>
                <div class="label">总玩家</div>
            </div>
            <div class="stat-card">
                <div class="icon"><i class="fas fa-trophy"></i></div>
                <div class="number" id="topWpm">--</div>
                <div class="label">最高 WPM</div>
            </div>
            <div class="stat-card">
                <div class="icon"><i class="fas fa-comment-dots"></i></div>
                <div class="number" id="totalMessages">--</div>
                <div class="label">留言总数</div>
            </div>
            <div class="stat-card">
                <div class="icon"><i class="fas fa-clock"></i></div>
                <div class="number" id="avgWpm">--</div>
                <div class="label">平均 WPM</div>
            </div>
        </div>

        <!-- 图表 -->
        <div class="charts-row">
            <!-- 排名 -->
            <div class="chart-box">
                <div class="title"><i class="fas fa-list"></i> 打字排名 TOP 10</div>
                <div class="rank-list" id="rankList">
                    <div class="empty-state">⏳ 加载中...</div>
                </div>
            </div>

            <!-- 留言动态 -->
            <div class="chart-box">
                <div class="title"><i class="fas fa-rss"></i> 最新留言</div>
                <div class="message-feed" id="messageFeed">
                    <div class="empty-state">⏳ 加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.eggfish.dpdns.org/api';

        // ===== 加载数据 =====
        async function loadDashboard() {
            try {
                // 并行请求
                const [rankingsRes, messagesRes] = await Promise.all([
                    fetch(`${API_BASE}/rankings?limit=10`),
                    fetch(`${API_BASE}/messages`)
                ]);

                const rankings = rankingsRes.ok ? await rankingsRes.json() : [];
                const messages = messagesRes.ok ? await messagesRes.json() : [];

                // ===== 更新统计 =====
                const totalPlayers = rankings.length;
                const topWpm = rankings.length > 0 ? rankings[0].wpm : 0;
                const totalMessages = messages.length;
                const avgWpm = rankings.length > 0
                    ? Math.round(rankings.reduce((sum, r) => sum + r.wpm, 0) / rankings.length)
                    : 0;

                document.getElementById('totalPlayers').textContent = totalPlayers;
                document.getElementById('topWpm').textContent = topWpm;
                document.getElementById('totalMessages').textContent = totalMessages;
                document.getElementById('avgWpm').textContent = avgWpm;

                // ===== 更新排名列表 =====
                const rankList = document.getElementById('rankList');
                if (rankings.length === 0) {
                    rankList.innerHTML = `<div class="empty-state">🏁 暂无数据，快去打字测试！</div>`;
                } else {
                    const maxWpm = rankings[0].wpm || 1;
                    rankList.innerHTML = rankings.map((item, index) => `
                    <div class="rank-item">
                        <span class="pos">#${index + 1}</span>
                        <span class="name">${escapeHtml(item.player_name)}</span>
                        <span class="wpm">${item.wpm}</span>
                        <div class="bar">
                            <div class="fill" style="width: ${(item.wpm / maxWpm) * 100}%;"></div>
                        </div>
                    </div>
                `).join('');
                }

                // ===== 更新留言动态 =====
                const feed = document.getElementById('messageFeed');
                if (messages.length === 0) {
                    feed.innerHTML = `<div class="empty-state">💬 暂无留言</div>`;
                } else {
                    const sorted = [...messages].sort((a, b) => (b.created_at || b.time || 0) - (a.created_at || a.time || 0));
                    feed.innerHTML = sorted.slice(0, 10).map(msg => `
                    <div class="feed-item">
                        <div>
                            <span class="author">${escapeHtml(msg.name || '匿名')}</span>
                            <span class="time">${formatTime(msg.created_at || msg.time)}</span>
                        </div>
                        <div class="text">${escapeHtml(msg.text || '…')}</div>
                    </div>
                `).join('');
                }

            } catch (error) {
                console.warn('加载仪表盘数据失败:', error);
                document.querySelectorAll('.empty-state').forEach(el => {
                    el.textContent = '⚠️ 加载失败，请刷新';
                });
            }
        }

        // ===== 辅助函数 =====
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const d = new Date(timestamp);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // ===== 刷新按钮 =====
        document.getElementById('refreshBtn').addEventListener('click', () => {
            const btn = document.getElementById('refreshBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷新中...';
            btn.disabled = true;
            loadDashboard().finally(() => {
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> 刷新';
                btn.disabled = false;
            });
        });

        // ===== 启动 =====
        loadDashboard();

        // 每 30 秒自动刷新
        setInterval(loadDashboard, 30000);
    </script>

</body>

</html>
