<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>瞄准训练 · Aim Trainer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" data-theme-icon />
    <script src="assets/theme.js"></script>
    <script src="assets/scores.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-body);
            background-image: radial-gradient(circle at 10% 20%, #13171f 0%, #080a0e 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-primary);
        }

        .glass-card {
            max-width: 980px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(12px) saturate(180%);
            border-radius: 2.2rem;
            padding: 1.6rem 1.8rem 1.4rem;
            border: 1px solid var(--primary-border);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--primary-border) inset;
            text-align: center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.9rem;
            gap: 0.6rem;
        }

        .header h1 {
            font-size: 1.15rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        .header h1 i {
            color: var(--primary);
            margin-right: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.75rem;
            padding: 0.2rem 1rem;
            border: 1px solid var(--primary-border);
            border-radius: 30px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .back-link:hover {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        /* ===== 模式页签 ===== */
        .mode-tabs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }

        .mode-tab {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.72rem;
            padding: 0.4rem 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-tab:hover {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        .mode-tab.active {
            color: var(--text-accent);
            border-color: var(--primary);
            background: rgba(var(--primary-rgb), 0.05);
            box-shadow: 0 0 16px var(--primary-glow);
        }

        .mode-desc {
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            min-height: 1.2em;
        }

        /* ===== 画布 ===== */
        .game-wrapper {
            background: var(--bg-input);
            border-radius: 1.2rem;
            padding: 0.3rem;
            border: 1px solid var(--border-color);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            aspect-ratio: 900/560;
            border-radius: 1rem;
            touch-action: none;
            cursor: pointer;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem;
            margin-top: 0.8rem;
            background: var(--bg-input);
            border-radius: 60px;
            border: 1px solid var(--border-color);
            font-size: 0.72rem;
            flex-wrap: wrap;
            gap: 0.3rem 1rem;
        }

        .status-bar span {
            font-weight: 600;
        }

        .status-bar .time span {
            color: var(--warn-color);
        }

        .status-bar .score span {
            color: var(--primary);
        }

        .status-bar .combo span {
            color: var(--primary-light);
        }

        .status-bar .acc span {
            color: var(--text-accent);
        }

        .status-bar .best span {
            color: var(--text-secondary);
        }

        .controls {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        .btn-primary {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        .btn-primary:hover {
            background: var(--primary);
            color: #0b0f18;
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .help {
            margin-top: 0.8rem;
            font-size: 0.63rem;
            color: var(--text-muted);
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <div class="glass-card">
        <div class="header">
            <h1><i class="fas fa-bullseye"></i>瞄准训练</h1>
            <div class="header-right">
                <div data-theme-switcher="compact"></div>
                <a href="games.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回</a>
            </div>
        </div>

        <div class="mode-tabs" id="modeTabs"></div>
        <div class="mode-desc" id="modeDesc"></div>

        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="status-bar">
            <div class="time">⏱ <span id="timeVal">--</span></div>
            <div class="score">分数 <span id="scoreVal">0</span></div>
            <div class="combo">连击 <span id="comboVal">0</span></div>
            <div class="acc">命中率 <span id="accVal">--</span></div>
            <div class="best">🏆 <span id="bestVal">0</span></div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> 开始</button>
            <button class="btn" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
            <button class="btn" id="muteBtn"><i class="fas fa-volume-up"></i> 音效</button>
        </div>

        <div class="help">
            <i class="fas fa-hand-pointer"></i> 点击目标射击 · <b>网格射击</b>三目标同屏 ·
            <b>甩枪</b>考验反应 · <b>追踪</b>按住目标不放 · 战绩自动上传云端排行
        </div>

        <div class="cloud-rank" data-cloud-rank="aim"></div>
    </div>

    <script>
        (() => {
            'use strict';

            /* ---------- 主题色 ---------- */
            function TC() {
                return getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#00e5b0';
            }
            function TCRGB() {
                return getComputedStyle(document.documentElement).getPropertyValue('--primary-rgb').trim() || '0, 255, 200';
            }

            /* ---------- 模式配置（?t=秒 可缩短时长便于调试） ---------- */
            const dbgDur = parseInt(new URLSearchParams(location.search).get('t') || '0', 10) || 0;
            const MODES = {
                gridshot: { name: '网格射击', desc: '60 秒 · 3 个目标同屏，击碎一个立刻重生一个', dur: 60, count: 3, r: 34 },
                flick: { name: '甩枪', desc: '30 秒 · 单目标随机出现，越快分越高', dur: 30, count: 1, r: 27 },
                track: { name: '追踪', desc: '30 秒 · 按住移动目标持续得分', dur: 30, count: 1, r: 30, moving: true },
            };
            let mode = 'gridshot';
            const durOf = m => dbgDur || MODES[m].dur;
            const bestKey = () => 'aim_best_' + mode;

            /* ---------- Canvas ---------- */
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const W = 900, H = 560;
            const TAU = Math.PI * 2;
            (function fit() {
                const dpr = Math.min(devicePixelRatio || 1, 2);
                canvas.width = W * dpr; canvas.height = H * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            })();

            /* ---------- DOM ---------- */
            const $ = id => document.getElementById(id);
            const timeEl = $('timeVal'), scoreEl = $('scoreVal'), comboEl = $('comboVal'),
                accEl = $('accVal'), bestEl = $('bestVal'),
                startBtn = $('startBtn'), resetBtn = $('resetBtn'), muteBtn = $('muteBtn'),
                modeTabs = $('modeTabs'), modeDesc = $('modeDesc');

            modeTabs.innerHTML = Object.keys(MODES).map(k =>
                `<button class="mode-tab${k === mode ? ' active' : ''}" data-m="${k}">${MODES[k].name}</button>`).join('');
            modeTabs.addEventListener('click', e => {
                const b = e.target.closest('[data-m]');
                if (!b) return;
                mode = b.dataset.m;
                modeTabs.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t === b));
                modeDesc.textContent = MODES[mode].desc;
                reset();
            });
            modeDesc.textContent = MODES[mode].desc;

            /* ---------- 音效（WebAudio 小合成器） ---------- */
            let actx = null, muted = false;
            function beep(freq, dur, type, vol) {
                if (muted) return;
                try {
                    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
                    const o = actx.createOscillator(), g = actx.createGain();
                    o.type = type || 'sine'; o.frequency.value = freq;
                    g.gain.setValueAtTime(vol || 0.12, actx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
                    o.connect(g).connect(actx.destination);
                    o.start(); o.stop(actx.currentTime + dur);
                } catch (e) { /* 忽略 */ }
            }
            const sndHit = c => beep(760 + Math.min(c, 20) * 28, 0.07, 'square', 0.09);
            const sndMiss = () => beep(150, 0.1, 'sawtooth', 0.06);
            const sndEnd = () => { beep(520, 0.12); setTimeout(() => beep(660, 0.12), 120); setTimeout(() => beep(880, 0.2), 240); };
            muteBtn.addEventListener('click', () => {
                muted = !muted;
                muteBtn.innerHTML = muted ? '<i class="fas fa-volume-xmark"></i> 音效' : '<i class="fas fa-volume-up"></i> 音效';
            });

            /* ---------- 游戏状态 ---------- */
            let state = 'ready';   // ready | playing | over
            let targets = [], particles = [], missMarks = [];
            let score = 0, shots = 0, hits = 0, combo = 0, bestCombo = 0;
            let timeLeft = 0, overSince = 0, newBest = false;
            let trackTime = 0, onTarget = 0;      // 追踪模式计时
            let crossX = W / 2, crossY = H / 2, recoil = 0;
            let pointerDown = false, trackingOn = false;

            const rand = (a, b) => a + Math.random() * (b - a);
            bestEl.textContent = localStorage.getItem(bestKey()) || 0;

            function spawnTarget() {
                const cfg = MODES[mode];
                const r = cfg.r;
                for (let tries = 0; tries < 30; tries++) {
                    const x = rand(r + 30, W - r - 30), y = rand(r + 30, H - r - 30);
                    const ok = targets.every(t => Math.hypot(t.x - x, t.y - y) > t.r + r + 24);
                    if (ok || tries === 29) {
                        targets.push({
                            x, y, r, born: 0,
                            vx: cfg.moving ? rand(-160, 160) : 0,
                            vy: cfg.moving ? rand(-160, 160) : 0,
                            turnT: rand(0.5, 1.4), phase: rand(0, TAU),
                        });
                        return;
                    }
                }
            }

            function reset() {
                state = 'ready';
                targets = []; particles = []; missMarks = [];
                score = 0; shots = 0; hits = 0; combo = 0; bestCombo = 0;
                timeLeft = durOf(mode); newBest = false;
                trackTime = 0; onTarget = 0; trackingOn = false;
                bestEl.textContent = localStorage.getItem(bestKey()) || 0;
                canvas.style.cursor = 'pointer';
                syncHud(); syncBtn();
            }

            function start() {
                reset();
                state = 'playing';
                for (let i = 0; i < MODES[mode].count; i++) spawnTarget();
                canvas.style.cursor = 'none';
                syncBtn();
            }

            function endGame() {
                state = 'over';
                overSince = performance.now();
                canvas.style.cursor = 'pointer';
                const finalScore = Math.round(score);
                newBest = finalScore > (Number(localStorage.getItem(bestKey())) || 0);
                if (newBest) localStorage.setItem(bestKey(), String(finalScore));
                bestEl.textContent = Math.max(finalScore, Number(localStorage.getItem(bestKey())) || 0);
                const acc = mode === 'track'
                    ? Math.round(onTarget / Math.max(trackTime, 0.01) * 100)
                    : (shots ? Math.round(hits / shots * 100) : 0);
                if (window.GameScores && finalScore > 0) {
                    GameScores.submit('aim', finalScore, MODES[mode].name + ' · ' + acc + '%');
                }
                sndEnd();
                syncHud(); syncBtn();
            }

            function syncBtn() {
                startBtn.innerHTML = state === 'playing' ? '<i class="fas fa-pause"></i> 结束'
                    : state === 'over' ? '<i class="fas fa-rotate-right"></i> 再来一局'
                        : '<i class="fas fa-play"></i> 开始';
            }

            let hudCache = '';
            function syncHud() {
                const acc = mode === 'track'
                    ? (trackTime ? Math.round(onTarget / trackTime * 100) + '%' : '--')
                    : (shots ? Math.round(hits / shots * 100) + '%' : '--');
                const key = [Math.ceil(timeLeft), score, combo, acc].join('|');
                if (key === hudCache) return;
                hudCache = key;
                timeEl.textContent = state === 'ready' ? durOf(mode) + 's' : Math.max(0, Math.ceil(timeLeft)) + 's';
                scoreEl.textContent = Math.round(score);
                comboEl.textContent = combo;
                accEl.textContent = acc;
            }

            /* ---------- 射击 ---------- */
            function toLocal(e) {
                const rect = canvas.getBoundingClientRect();
                return { x: (e.clientX - rect.left) * W / rect.width, y: (e.clientY - rect.top) * H / rect.height };
            }

            canvas.addEventListener('pointerdown', e => {
                e.preventDefault();
                const p = toLocal(e);
                crossX = p.x; crossY = p.y;
                pointerDown = true;
                if (state === 'ready') { start(); return; }
                if (state === 'over') {
                    if (performance.now() - overSince > 700) start();
                    return;
                }
                if (mode === 'track') return;   // 追踪模式按住即可，无射击
                shoot(p.x, p.y);
            });
            window.addEventListener('pointerup', () => { pointerDown = false; });
            canvas.addEventListener('pointermove', e => {
                const p = toLocal(e);
                crossX = p.x; crossY = p.y;
            });
            canvas.addEventListener('contextmenu', e => e.preventDefault());

            function shoot(x, y) {
                shots++;
                recoil = 1;
                let hitIdx = -1, bestD = 1e9;
                targets.forEach((t, i) => {
                    const d = Math.hypot(t.x - x, t.y - y);
                    if (d <= t.r && d < bestD) { bestD = d; hitIdx = i; }
                });
                if (hitIdx >= 0) {
                    hits++; combo++; bestCombo = Math.max(bestCombo, combo);
                    score += 100 + combo * 5;
                    const t = targets[hitIdx];
                    burst(t.x, t.y);
                    sndHit(combo);
                    targets.splice(hitIdx, 1);
                    spawnTarget();
                } else {
                    combo = 0;
                    missMarks.push({ x, y, life: 1 });
                    sndMiss();
                }
                syncHud();
            }

            function burst(x, y) {
                for (let i = 0; i < 10; i++) {
                    const a = rand(0, TAU), s = rand(60, 220);
                    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: rand(1.5, 3.5), life: 1 });
                }
            }

            startBtn.addEventListener('click', () => { if (state === 'playing') endGame(); else start(); });
            resetBtn.addEventListener('click', reset);

            /* ---------- 更新 ---------- */
            function update(dt, now) {
                if (state === 'playing') {
                    timeLeft -= dt;
                    if (timeLeft <= 0) { timeLeft = 0; endGame(); }

                    targets.forEach(t => {
                        t.born = Math.min(1, t.born + dt / 0.15);
                        if (MODES[mode].moving) {
                            // 游走转向 + 撞墙反弹
                            t.turnT -= dt;
                            if (t.turnT <= 0) {
                                t.turnT = rand(0.5, 1.4);
                                const a = rand(0, TAU), sp = rand(130, 230);
                                t.vx += Math.cos(a) * sp; t.vy += Math.sin(a) * sp;
                                const v = Math.hypot(t.vx, t.vy) || 1;
                                const cap = 240;
                                t.vx = t.vx / v * Math.min(v, cap);
                                t.vy = t.vy / v * Math.min(v, cap);
                            }
                            t.x += t.vx * dt; t.y += t.vy * dt;
                            if (t.x < t.r + 10) { t.x = t.r + 10; t.vx = Math.abs(t.vx); }
                            if (t.x > W - t.r - 10) { t.x = W - t.r - 10; t.vx = -Math.abs(t.vx); }
                            if (t.y < t.r + 10) { t.y = t.r + 10; t.vy = Math.abs(t.vy); }
                            if (t.y > H - t.r - 10) { t.y = H - t.r - 10; t.vy = -Math.abs(t.vy); }
                        }
                    });

                    // 追踪模式计分
                    if (mode === 'track') {
                        trackTime += dt;
                        trackingOn = false;
                        if (pointerDown) {
                            for (const t of targets) {
                                if (Math.hypot(t.x - crossX, t.y - crossY) <= t.r + 6) { trackingOn = true; break; }
                            }
                        }
                        if (trackingOn) { onTarget += dt; score += dt * 120; }
                    }
                }

                particles.forEach(p => {
                    p.x += p.vx * dt; p.y += p.vy * dt;
                    p.vx *= 0.96; p.vy *= 0.96;
                    p.life -= dt / 0.5;
                });
                particles = particles.filter(p => p.life > 0);
                missMarks.forEach(m => m.life -= dt / 0.6);
                missMarks = missMarks.filter(m => m.life > 0);
                recoil = Math.max(0, recoil - dt * 6);

                syncHud();
            }

            /* ---------- 绘制 ---------- */
            function drawTarget(t, now) {
                const scale = 0.6 + 0.4 * (1 - Math.pow(1 - t.born, 3));   // 弹出动画
                const r = t.r * scale;
                const pulse = MODES[mode].moving ? 1 + Math.sin(now / 300 + t.phase) * 0.04 : 1;
                const R = r * pulse;
                const rgb = TCRGB();
                ctx.save();
                // 外圈
                ctx.beginPath(); ctx.arc(t.x, t.y, R, 0, TAU);
                ctx.fillStyle = 'rgba(' + rgb + ', 0.08)';
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = 'rgba(' + rgb + ', 0.85)';
                ctx.stroke();
                // 内圈
                ctx.beginPath(); ctx.arc(t.x, t.y, R * 0.55, 0, TAU);
                ctx.fillStyle = 'rgba(' + rgb + ', 0.22)';
                ctx.fill();
                // 中心点
                ctx.beginPath(); ctx.arc(t.x, t.y, Math.max(2, R * 0.12), 0, TAU);
                ctx.fillStyle = 'rgba(' + rgb + ', 1)';
                ctx.fill();
                ctx.restore();
            }

            function drawCrosshair() {
                const rgb = TCRGB();
                const spread = 7 + recoil * 9;
                const len = 9;
                ctx.save();
                ctx.strokeStyle = 'rgba(' + rgb + ', 0.95)';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(crossX - spread - len, crossY); ctx.lineTo(crossX - spread, crossY);
                ctx.moveTo(crossX + spread, crossY); ctx.lineTo(crossX + spread + len, crossY);
                ctx.moveTo(crossX, crossY - spread - len); ctx.lineTo(crossX, crossY - spread);
                ctx.moveTo(crossX, crossY + spread); ctx.lineTo(crossX, crossY + spread + len);
                ctx.stroke();
                ctx.beginPath(); ctx.arc(crossX, crossY, 1.6, 0, TAU);
                ctx.fillStyle = 'rgba(' + rgb + ', 1)';
                ctx.fill();
                if (mode === 'track' && state === 'playing') {
                    ctx.beginPath(); ctx.arc(crossX, crossY, 26, 0, TAU);
                    ctx.strokeStyle = 'rgba(' + rgb + ', ' + (trackingOn ? 0.5 : 0.2) + ')';
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                }
                ctx.restore();
            }

            function drawOverlay(now) {
                if (state === 'playing') {
                    // 顶部时间条
                    const pct = timeLeft / durOf(mode);
                    const rgb = TCRGB();
                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.fillRect(0, 0, W, 4);
                    ctx.fillStyle = 'rgba(' + rgb + ', 0.8)';
                    ctx.fillRect(0, 0, W * pct, 4);
                    return;
                }
                ctx.save();
                ctx.fillStyle = 'rgba(4,10,18,0.72)';
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center';
                const rgb = TCRGB();

                if (state === 'ready') {
                    ctx.shadowColor = TC(); ctx.shadowBlur = 22;
                    ctx.fillStyle = TC();
                    ctx.font = '700 40px "JetBrains Mono", monospace';
                    ctx.fillText(MODES[mode].name, W / 2, H / 2 - 66);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(214,224,240,0.92)';
                    ctx.font = '500 15px "JetBrains Mono", monospace';
                    ctx.fillText(MODES[mode].desc, W / 2, H / 2 - 28);
                    ctx.fillStyle = 'rgba(106,142,138,0.95)';
                    ctx.font = '400 13px "JetBrains Mono", monospace';
                    ctx.fillText(mode === 'track' ? '点击开始 · 按住目标得分' : '点击画布开始 · 又快又准', W / 2, H / 2 + 8);
                    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now / 300);
                    ctx.fillStyle = '#fff';
                    ctx.font = '600 14px "JetBrains Mono", monospace';
                    ctx.fillText('本地最佳 ' + (localStorage.getItem(bestKey()) || 0), W / 2, H / 2 + 46);
                } else {
                    const acc = mode === 'track'
                        ? Math.round(onTarget / Math.max(trackTime, 0.01) * 100) + '%'
                        : (shots ? Math.round(hits / shots * 100) + '%' : '--');
                    ctx.fillStyle = TC();
                    ctx.font = '700 34px "JetBrains Mono", monospace';
                    ctx.fillText('时间到', W / 2, H / 2 - 110);
                    ctx.fillStyle = 'rgba(214,224,240,0.95)';
                    ctx.font = '600 26px "JetBrains Mono", monospace';
                    ctx.fillText('得分 ' + Math.round(score) + (newBest ? '  🏆 新纪录' : ''), W / 2, H / 2 - 62);
                    ctx.font = '500 14px "JetBrains Mono", monospace';
                    ctx.fillStyle = 'rgba(106,142,138,0.95)';
                    const lines = mode === 'track'
                        ? ['追踪时长占比 ' + acc]
                        : ['命中 ' + hits + ' / 射击 ' + shots + ' · 命中率 ' + acc, '最高连击 ' + bestCombo];
                    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 - 24 + i * 24));
                    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now / 300);
                    ctx.fillStyle = '#fff';
                    ctx.font = '600 14px "JetBrains Mono", monospace';
                    ctx.fillText('点击画布 再来一局 · 战绩已上传云端', W / 2, H / 2 + 44);
                }
                ctx.restore();
            }

            function render(now) {
                ctx.clearRect(0, 0, W, H);
                const rgb = TCRGB();
                // 背景网格（射击场质感）
                ctx.strokeStyle = 'rgba(' + rgb + ', 0.035)';
                ctx.lineWidth = 1;
                for (let x = 0; x <= W; x += 45) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
                for (let y = 0; y <= H; y += 45) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

                missMarks.forEach(m => {
                    ctx.globalAlpha = m.life * 0.6;
                    ctx.strokeStyle = 'rgba(255,107,107,0.9)';
                    ctx.lineWidth = 2;
                    const s = 5 + (1 - m.life) * 6;
                    ctx.beginPath();
                    ctx.moveTo(m.x - s, m.y - s); ctx.lineTo(m.x + s, m.y + s);
                    ctx.moveTo(m.x + s, m.y - s); ctx.lineTo(m.x - s, m.y + s);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                });

                targets.forEach(t => drawTarget(t, now));

                particles.forEach(p => {
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU);
                    ctx.fillStyle = TC(); ctx.fill();
                });
                ctx.globalAlpha = 1;

                if (state === 'playing') drawCrosshair();
                drawOverlay(now);
            }

            /* ---------- 主循环 ---------- */
            let last = performance.now();
            function frame(now) {
                const dt = Math.min(0.034, (now - last) / 1000);
                last = now;
                update(dt, now);
                render(now);
                requestAnimationFrame(frame);
            }
            reset();
            requestAnimationFrame(frame);
        })();
    </script>

</body>

</html>
