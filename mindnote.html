<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindNote · 知识库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" data-theme-icon />
    <script src="assets/theme.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'JetBrains Mono', monospace;
            background: var(--bg-body);
            background-image: radial-gradient(circle at 10% 20%, #13171f 0%, #080a0e 90%);
            min-height: 100vh;
            padding: 2rem;
            color: var(--text-primary);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0 2rem;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header h1 i {
            color: var(--primary);
            margin-right: 10px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.3rem 1.2rem;
            border: 1px solid var(--primary-border);
            border-radius: 30px;
            transition: 0.2s;
        }

        .back-link:hover {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1.8rem;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 0.45rem 1.1rem;
            flex: 1;
            min-width: 200px;
            transition: 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .search-box i {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            width: 100%;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .btn-add {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--text-accent);
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-add:hover {
            background: var(--primary);
            color: #0b0f18;
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .toolbar-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .hint {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.8;
            border-left: 2px solid var(--primary-border);
            padding-left: 0.8rem;
        }

        /* 链接网格 */
        .note-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-top: 1.6rem;
        }

        .note-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1.6rem;
            padding: 1.5rem;
            transition: 0.3s;
            cursor: pointer;
            color: inherit;
            display: block;
            position: relative;
            text-decoration: none;
        }

        .note-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 0 40px var(--primary-glow);
        }

        .note-card .icon {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 0.6rem;
        }

        .note-card h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-accent);
            margin-bottom: 0.3rem;
            padding-right: 3.2rem;
            word-break: break-word;
        }

        .note-card p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .card-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            margin-top: 0.7rem;
        }

        .note-card .tag {
            display: inline-block;
            font-size: 0.6rem;
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            background: rgba(var(--primary-rgb), 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .note-card .src {
            font-size: 0.6rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 60%;
        }

        .card-tools {
            position: absolute;
            top: 0.9rem;
            right: 0.9rem;
            display: flex;
            gap: 0.35rem;
            opacity: 0;
            transition: 0.2s;
        }

        .note-card:hover .card-tools,
        .note-card:focus-within .card-tools {
            opacity: 1;
        }

        .card-tool {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .card-tool:hover {
            color: var(--text-accent);
            border-color: var(--primary);
        }

        .card-tool.del:hover {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.4);
        }

        .card-tool.done {
            color: var(--correct-color);
            border-color: var(--correct-color);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--border-color);
            margin-bottom: 1rem;
            display: block;
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        /* 弹窗 */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 8, 12, 0.78);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.6rem;
            z-index: 100;
        }

        .overlay.show {
            display: flex;
        }

        .dialog {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            border: 1px solid var(--primary-border);
            border-radius: 1.6rem;
            padding: 1.6rem;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
        }

        .dialog h3 {
            font-size: 1rem;
            color: var(--text-accent);
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .dialog h3 i {
            color: var(--primary);
        }

        .dialog p {
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 0.6rem;
        }

        .dialog label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin: 0.8rem 0 0.3rem;
        }

        .dialog input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 0.55rem 1.1rem;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            outline: none;
        }

        .dialog input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-top: 1.3rem;
        }

        .ghost-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1.2rem;
            border-radius: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .ghost-btn:hover {
            color: var(--text-accent);
            border-color: var(--primary);
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.3rem;
            }

            .note-grid {
                grid-template-columns: 1fr;
            }

            .card-tools {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1><i class="fas fa-pen-fancy"></i> MindNote</h1>
            <div class="header-actions">
                <div data-theme-switcher></div>
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回</a>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索标题 / 标签 / 域名…" />
            </div>
            <button class="btn-add" id="addBtn"><i class="fas fa-plus"></i> 添加链接</button>
            <span class="toolbar-status" id="statusText"></span>
        </div>
        <div class="hint">
            ▸ 点击卡片直接在新标签页打开原网站 —— 不抓取正文、不发任何请求，所以是秒开<br />
            ▸ 自己添加的链接只存在本机 localStorage，清缓存会丢；卡片右上角可复制链接或删除
        </div>

        <!-- 链接列表 -->
        <div class="note-grid" id="noteGrid"></div>
    </div>

    <!-- 添加链接弹窗 -->
    <div class="overlay" id="addOverlay">
        <div class="dialog">
            <h3><i class="fas fa-link"></i> 添加链接</h3>
            <p>只保存标题和网址，不做任何抓取。</p>
            <label for="urlInput">网址</label>
            <input type="text" id="urlInput" placeholder="https://developer.mozilla.org/zh-CN/docs/Web/JavaScript" />
            <label for="titleInput">标题（留空则用域名）</label>
            <input type="text" id="titleInput" placeholder="例如：MDN JavaScript 文档" maxlength="40" />
            <label for="tagInput">标签（可选）</label>
            <input type="text" id="tagInput" placeholder="前端 / 后端 / 灵感…" maxlength="12" />
            <div class="dialog-actions">
                <button class="ghost-btn" id="cancelAddBtn" type="button">取消</button>
                <button class="btn-add" id="confirmAddBtn" type="button"><i class="fas fa-check"></i> 保存</button>
            </div>
        </div>
    </div>

    <script>
        // ===== MindNote · 链接收藏（纯本地，无任何网络抓取）=====
        (function () {
            'use strict';

            var LS_NOTES = 'mindnote_user_notes';

            /* 内置收藏：全部是真实可访问的网址 */
            var BUILTIN_NOTES = [
                {
                    id: 'b1', icon: 'fa-code', title: 'TypeScript 泛型手册',
                    desc: '泛型、约束、条件类型与工具类型的官方讲解',
                    tag: '前端', url: 'https://www.typescriptlang.org/docs/handbook/2/generics.html'
                },
                {
                    id: 'b2', icon: 'fa-database', title: 'Cloudflare D1 文档',
                    desc: 'D1 数据库的建表、查询、迁移与最佳实践',
                    tag: '后端', url: 'https://developers.cloudflare.com/d1/'
                },
                {
                    id: 'b3', icon: 'fa-cloud', title: 'Cloudflare Workers',
                    desc: 'Workers 运行时、路由与 Pages Functions 整合',
                    tag: '运维', url: 'https://developers.cloudflare.com/workers/'
                },
                {
                    id: 'b4', icon: 'fa-terminal', title: 'Bash 命令速查',
                    desc: 'Linux 常用命令、参数与示例的完整索引',
                    tag: '系统', url: 'https://ss64.com/bash/'
                },
                {
                    id: 'b5', icon: 'fa-palette', title: '设计系统 101',
                    desc: 'Nielsen Norman Group 关于设计系统的入门文章',
                    tag: '设计', url: 'https://www.nngroup.com/articles/design-systems-101/'
                },
                {
                    id: 'b6', icon: 'fa-robot', title: '提示工程指南',
                    desc: 'Prompt 工程、RAG、Agent 与工具调用的中文指南',
                    tag: 'AI', url: 'https://www.promptingguide.ai/zh'
                }
            ];

            var userNotes = readJSON(LS_NOTES, []);
            var filterText = '';

            var grid = document.getElementById('noteGrid');
            var statusText = document.getElementById('statusText');
            var searchInput = document.getElementById('searchInput');
            var addOverlay = document.getElementById('addOverlay');
            var urlInput = document.getElementById('urlInput');
            var titleInput = document.getElementById('titleInput');
            var tagInput = document.getElementById('tagInput');
            var addBtn = document.getElementById('addBtn');
            var confirmAddBtn = document.getElementById('confirmAddBtn');
            var cancelAddBtn = document.getElementById('cancelAddBtn');

            /* ---------- 工具函数 ---------- */
            function readJSON(key, fallback) {
                try {
                    var raw = localStorage.getItem(key);
                    if (!raw) return fallback;
                    var val = JSON.parse(raw);
                    return val === null || val === undefined ? fallback : val;
                } catch (e) { return fallback; }
            }

            function writeJSON(key, val) {
                try { localStorage.setItem(key, JSON.stringify(val)); return true; }
                catch (e) { return false; }
            }

            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return String(unsafe)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
            }

            function domainOf(url) {
                try { return new URL(url).hostname.replace(/^www\./, ''); }
                catch (e) { return url; }
            }

            function normalizeUrl(input) {
                var url = String(input || '').trim();
                if (!url) return '';
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url.replace(/^\/+/, '');
                try { new URL(url); return url; } catch (e) { return ''; }
            }

            function copyText(text, btn) {
                var orig = btn.innerHTML;
                var done = function () {
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                    btn.classList.add('done');
                    setTimeout(function () { btn.innerHTML = orig; btn.classList.remove('done'); }, 1200);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(done, done);
                } else {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); } catch (e) { }
                    ta.remove();
                    done();
                }
            }

            /* ---------- 渲染 ---------- */
            function allNotes() { return userNotes.concat(BUILTIN_NOTES); }

            function visibleNotes() {
                var q = filterText.trim().toLowerCase();
                var list = allNotes();
                if (!q) return list;
                return list.filter(function (n) {
                    return [n.title, n.desc, n.tag, n.url].join(' ').toLowerCase().indexOf(q) > -1;
                });
            }

            function renderGrid() {
                var list = visibleNotes();
                statusText.textContent = list.length + ' 条链接 · 自建 ' + userNotes.length;

                if (!list.length) {
                    grid.innerHTML = '<div class="empty-state"><i class="fas fa-book-open"></i><p>' +
                        (filterText ? '没有匹配的链接 🔍' : '还没有收藏，点右上角「添加链接」') + '</p></div>';
                    return;
                }

                grid.innerHTML = list.map(function (note, idx) {
                    return '<a class="note-card" data-idx="' + idx + '" href="' + escapeHtml(note.url) + '" ' +
                        'target="_blank" rel="noopener noreferrer" title="' + escapeHtml(note.url) + '">' +
                        '<div class="card-tools">' +
                        '<button class="card-tool copy" data-copy="' + escapeHtml(note.url) + '" title="复制链接"><i class="fas fa-link"></i></button>' +
                        (note.custom ? '<button class="card-tool del" data-del="' + escapeHtml(note.id) + '" title="删除"><i class="fas fa-xmark"></i></button>' : '') +
                        '</div>' +
                        '<div class="icon"><i class="fas ' + (note.icon || 'fa-link') + '"></i></div>' +
                        '<h3>' + escapeHtml(note.title) + '</h3>' +
                        '<p>' + escapeHtml(note.desc || '') + '</p>' +
                        '<div class="card-foot">' +
                        '<span class="tag">#' + escapeHtml(note.tag || '收藏') + '</span>' +
                        '<span class="src"><i class="fas fa-arrow-up-right-from-square"></i> ' + escapeHtml(domainOf(note.url)) + '</span>' +
                        '</div></a>';
                }).join('');

                Array.prototype.forEach.call(grid.querySelectorAll('.card-tool.copy'), function (btn) {
                    btn.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        copyText(btn.getAttribute('data-copy'), btn);
                    });
                });

                Array.prototype.forEach.call(grid.querySelectorAll('.card-tool.del'), function (btn) {
                    btn.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        var id = btn.getAttribute('data-del');
                        var note = userNotes.filter(function (n) { return n.id === id; })[0];
                        if (!note) return;
                        if (!confirm('删除收藏「' + note.title + '」？')) return;
                        userNotes = userNotes.filter(function (n) { return n.id !== id; });
                        writeJSON(LS_NOTES, userNotes);
                        renderGrid();
                    });
                });
            }

            /* ---------- 添加链接（不联网） ---------- */
            function addNote() {
                var url = normalizeUrl(urlInput.value);
                if (!url) { alert('请填写有效的网址 ✦'); return; }

                var title = titleInput.value.trim() || domainOf(url);
                if (allNotes().some(function (n) { return n.url === url; })) {
                    alert('这个网址已经在收藏里了');
                    return;
                }

                userNotes.unshift({
                    id: 'u' + Date.now(),
                    custom: true,
                    icon: 'fa-link',
                    title: title,
                    desc: '自建收藏 · ' + domainOf(url),
                    tag: tagInput.value.trim() || '收藏',
                    url: url
                });
                writeJSON(LS_NOTES, userNotes);
                hideOverlay(addOverlay);
                renderGrid();
            }

            /* ---------- 事件 ---------- */
            function showOverlay(el) { el.classList.add('show'); }
            function hideOverlay(el) { el.classList.remove('show'); }

            searchInput.addEventListener('input', function () {
                filterText = searchInput.value;
                renderGrid();
            });

            addBtn.addEventListener('click', function () {
                urlInput.value = '';
                titleInput.value = '';
                tagInput.value = '';
                showOverlay(addOverlay);
                setTimeout(function () { urlInput.focus(); }, 50);
            });

            confirmAddBtn.addEventListener('click', addNote);
            cancelAddBtn.addEventListener('click', function () { hideOverlay(addOverlay); });

            addOverlay.addEventListener('click', function (e) {
                if (e.target === addOverlay) hideOverlay(addOverlay);
            });

            var inputs = [urlInput, titleInput, tagInput];
            inputs.forEach(function (el) {
                el.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') { e.preventDefault(); addNote(); }
                });
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && addOverlay.classList.contains('show')) hideOverlay(addOverlay);
            });

            /* ---------- 初始化 ---------- */
            renderGrid();
        })();
    </script>

</body>

</html>
