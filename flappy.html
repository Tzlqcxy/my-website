<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Flappy · 极客小鸟</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/theme.css" />
    <script src="assets/theme.js"></script>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-body);
            background-image: radial-gradient(circle at 10% 20%, #13171f 0%, #080a0e 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-primary);
        }

        .glass-card {
            max-width: 500px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(12px) saturate(180%);
            border-radius: 2.5rem;
            padding: 1.8rem 1.8rem 1.5rem;
            border: 1px solid var(--primary-border);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--primary-border) inset;
            transition: border-color 0.3s;
            text-align: center;
        }

        .glass-card:hover {
            border-color: var(--primary-border-hover);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header h1 i {
            color: var(--primary);
            margin-right: 8px;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.75rem;
            padding: 0.2rem 1rem;
            border: 1px solid var(--primary-border);
            border-radius: 30px;
            transition: 0.2s;
        }

        .back-link:hover {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        /* ===== 游戏画布 ===== */
        .game-wrapper {
            background: var(--bg-input);
            border-radius: 1.2rem;
            padding: 0.3rem;
            border: 1px solid var(--border-color);
            position: relative;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            aspect-ratio: 400/600;
            background: #0f1a2a;
            border-radius: 1rem;
            image-rendering: pixelated;
            cursor: pointer;
            touch-action: none;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.8rem;
            margin-top: 0.8rem;
            background: var(--bg-input);
            border-radius: 60px;
            border: 1px solid var(--border-color);
            font-size: 0.75rem;
        }

        .status-bar .score span {
            color: var(--primary);
            font-weight: 600;
        }

        .status-bar .best span {
            color: var(--primary-light);
            font-weight: 600;
        }

        /* ===== 控制 ===== */
        .controls {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls .btn {
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .controls .btn:hover {
            border-color: var(--primary);
            color: var(--text-accent);
        }

        .controls .btn-primary {
            background: var(--primary);
            color: #0b0f18;
            border-color: var(--primary);
        }

        .controls .btn-primary:hover {
            box-shadow: 0 0 30px var(--primary-glow);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            body {
                padding: 0.8rem;
            }

            .glass-card {
                padding: 1rem;
                border-radius: 1.8rem;
            }

            .header h1 {
                font-size: 1rem;
            }

            .status-bar {
                font-size: 0.65rem;
                padding: 0.3rem 0.6rem;
            }

            .controls .btn {
                padding: 0.3rem 0.8rem;
                font-size: 0.6rem;
            }
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <!-- 头部 -->
        <div class="header">
            <h1><i class="fas fa-crow"></i> Flappy</h1>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回</a>
            <div data-theme-switcher="compact"></div>
        </div>

        <!-- 游戏 -->
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
        </div>

        <!-- 状态 -->
        <div class="status-bar">
            <div class="score">🏆 <span id="scoreDisplay">0</span></div>
            <div class="best">🏅 最高 <span id="bestDisplay">0</span></div>
            <div id="statusMsg" style="color:var(--text-muted);font-size:0.65rem;">按空格/点击开始</div>
        </div>

        <!-- 控制 -->
        <div class="controls">
            <button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> 开始</button>
            <button class="btn" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
        </div>
    </div>

    <script>
        // 主题色：由 assets/theme.js 维护当前值，换肤后 canvas 也跟着变色
        function TC() {
            return (window.GeekTheme && GeekTheme.colors()) ||
                { primary: '#00e5b0', dark: '#00b894', light: '#55efc4', rgb: '0, 255, 200' };
        }

        (function () {
            // ===== Canvas =====
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const W = 400, H = 600;

            // ===== 游戏状态 =====
            const GRAVITY = 0.25;
            const JUMP_FORCE = -5.5;
            const PIPE_WIDTH = 50;
            const PIPE_GAP = 160;
            const PIPE_SPEED = 2.5;

            let bird = { x: 70, y: 250, vy: 0, size: 14 };
            let pipes = [];
            let score = 0;
            let bestScore = parseInt(localStorage.getItem('flappy_best')) || 0;
            let gameState = 'idle'; // idle, playing, over
            let frameId = null;
            let pipeTimer = 0;
            const PIPE_INTERVAL = 100;

            // ===== DOM =====
            const scoreDisplay = document.getElementById('scoreDisplay');
            const bestDisplay = document.getElementById('bestDisplay');
            const statusMsg = document.getElementById('statusMsg');

            bestDisplay.textContent = bestScore;

            // ===== 重置 =====
            function resetGame() {
                bird.x = 70;
                bird.y = 250;
                bird.vy = 0;
                pipes = [];
                score = 0;
                pipeTimer = 0;
                gameState = 'idle';
                scoreDisplay.textContent = '0';
                statusMsg.textContent = '按 空格 / 点击 开始';
                draw();
            }

            // ===== 跳跃 =====
            function jump() {
                if (gameState === 'idle') {
                    gameState = 'playing';
                    statusMsg.textContent = '🎮 飞行中...';
                }
                if (gameState === 'playing') {
                    bird.vy = JUMP_FORCE;
                }
                if (gameState === 'over') {
                    resetGame();
                }
            }

            // ===== 碰撞检测 =====
            function checkCollision() {
                // 边界碰撞
                if (bird.y - bird.size < 0 || bird.y + bird.size > H) {
                    return true;
                }

                // 管道碰撞
                for (const p of pipes) {
                    // 水平碰撞
                    if (bird.x + bird.size > p.x && bird.x - bird.size < p.x + PIPE_WIDTH) {
                        // 垂直碰撞：上方管道底部 或 下方管道顶部
                        if (bird.y - bird.size < p.top || bird.y + bird.size > p.top + PIPE_GAP) {
                            return true;
                        }
                    }
                }
                return false;
            }

            // ===== 更新 =====
            function update() {
                if (gameState !== 'playing') return;

                // 物理
                bird.vy += GRAVITY;
                bird.y += bird.vy;

                // 生成管道
                pipeTimer++;
                if (pipeTimer >= PIPE_INTERVAL) {
                    pipeTimer = 0;
                    const top = Math.random() * (H - PIPE_GAP - 80) + 40;
                    pipes.push({ x: W, top: top });
                }

                // 移动管道
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= PIPE_SPEED;
                    // 计分
                    if (pipes[i].x + PIPE_WIDTH < bird.x && !pipes[i].scored) {
                        pipes[i].scored = true;
                        score++;
                        scoreDisplay.textContent = score;
                    }
                    // 移除
                    if (pipes[i].x + PIPE_WIDTH < 0) {
                        pipes.splice(i, 1);
                    }
                }

                // 碰撞检测
                if (checkCollision()) {
                    gameState = 'over';
                    statusMsg.textContent = '💀 游戏结束 · 点击重新开始';
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem('flappy_best', bestScore);
                        bestDisplay.textContent = bestScore;
                    }
                }
            }

            // ===== 绘制 =====
            function draw() {
                ctx.clearRect(0, 0, W, H);

                // ----- 背景渐变 -----
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#0f1a2a');
                grad.addColorStop(0.4, '#152433');
                grad.addColorStop(0.7, '#1a2d3d');
                grad.addColorStop(1, '#0d1823');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // ----- 星星 -----
                for (let i = 0; i < 40; i++) {
                    const sx = (i * 137 + 50) % W;
                    const sy = (i * 251 + 30) % H;
                    const size = (i % 3) + 1;
                    const alpha = 0.1 + (i % 5) * 0.07;
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // ----- 管道 -----
                for (const p of pipes) {
                    const gradPipe = ctx.createLinearGradient(p.x, 0, p.x + PIPE_WIDTH, 0);
                    gradPipe.addColorStop(0, '#1a5a3a');
                    gradPipe.addColorStop(0.3, '#2a8a5a');
                    gradPipe.addColorStop(0.7, '#2a8a5a');
                    gradPipe.addColorStop(1, '#1a5a3a');

                    // 上方管道
                    ctx.fillStyle = gradPipe;
                    ctx.shadowColor = `rgba(${TC().rgb}, 0.05)`;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.roundRect(p.x, 0, PIPE_WIDTH, p.top, 4);
                    ctx.fill();

                    // 上方管道帽
                    ctx.fillStyle = '#1a6a3a';
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.roundRect(p.x - 6, p.top - 18, PIPE_WIDTH + 12, 18, 4);
                    ctx.fill();

                    // 下方管道
                    ctx.fillStyle = gradPipe;
                    ctx.shadowBlur = 10;
                    const bottomY = p.top + PIPE_GAP;
                    ctx.beginPath();
                    ctx.roundRect(p.x, bottomY, PIPE_WIDTH, H - bottomY, 4);
                    ctx.fill();

                    // 下方管道帽
                    ctx.fillStyle = '#1a6a3a';
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.roundRect(p.x - 6, bottomY, PIPE_WIDTH + 12, 18, 4);
                    ctx.fill();

                    ctx.shadowBlur = 0;

                    // 管道光晕（顶部）
                    ctx.fillStyle = `rgba(${TC().rgb}, 0.03)`;
                    ctx.beginPath();
                    ctx.roundRect(p.x + 4, 0, 6, p.top, 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.roundRect(p.x + 4, bottomY, 6, H - bottomY, 2);
                    ctx.fill();
                }

                // ----- 小鸟 -----
                const bx = bird.x, by = bird.y, size = bird.size;

                // 发光
                const glow = ctx.createRadialGradient(bx, by, 2, bx, by, size * 2);
                glow.addColorStop(0, `rgba(${TC().rgb}, 0.08)`);
                glow.addColorStop(1, `rgba(${TC().rgb}, 0)`);
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(bx, by, size * 2, 0, Math.PI * 2);
                ctx.fill();

                // 身体
                const angle = Math.min(Math.max(bird.vy * 0.03, -0.4), 0.6);
                ctx.save();
                ctx.translate(bx, by);
                ctx.rotate(angle);

                // 身体圆
                ctx.shadowColor = `rgba(${TC().rgb}, 0.2)`;
                ctx.shadowBlur = 15;
                const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, size);
                bodyGrad.addColorStop(0, '#8cf0d0');
                bodyGrad.addColorStop(0.6, TC().primary);
                bodyGrad.addColorStop(1, TC().dark);
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.arc(0, 0, size, 0, Math.PI * 2);
                ctx.fill();

                // 翅膀（扇动效果）
                const wingAngle = gameState === 'playing' ? Math.sin(Date.now() / 120) * 0.5 : 0;
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0,229,176,0.3)';
                ctx.beginPath();
                ctx.ellipse(-6, -2 - wingAngle * 4, 8, 5 + wingAngle * 3, -0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(0,229,176,0.2)';
                ctx.beginPath();
                ctx.ellipse(6, -2 + wingAngle * 4, 8, 5 - wingAngle * 3, 0.3, 0, Math.PI * 2);
                ctx.fill();

                // 眼睛
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(5, -3, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(10, -3, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0b0d12';
                ctx.beginPath();
                ctx.arc(7, -1, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(12, -1, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // 眼睛高光
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.arc(6, -3.5, 1, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(11, -3.5, 1, 0, Math.PI * 2);
                ctx.fill();

                // 嘴巴
                ctx.fillStyle = '#f0a050';
                ctx.beginPath();
                ctx.moveTo(size + 2, 0);
                ctx.lineTo(size + 10, 2);
                ctx.lineTo(size + 2, 4);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
                ctx.shadowBlur = 0;

                // ----- 游戏结束遮罩 -----
                if (gameState === 'over') {
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.font = '28px JetBrains Mono, monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ff6b6b';
                    ctx.shadowColor = 'rgba(255,100,100,0.2)';
                    ctx.shadowBlur = 30;
                    ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
                    ctx.shadowBlur = 0;
                    ctx.font = '16px JetBrains Mono, monospace';
                    ctx.fillStyle = 'var(--text-muted)';
                    ctx.fillText('点击 / 空格 重新开始', W / 2, H / 2 + 30);
                }

                // ----- 开始提示 -----
                if (gameState === 'idle') {
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.font = '20px JetBrains Mono, monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fillText('🕹️ 点击 / 空格 起飞', W / 2, H / 2);
                }
            }

            // ===== 游戏循环 =====
            function gameLoop() {
                update();
                draw();
                frameId = requestAnimationFrame(gameLoop);
            }

            // ===== 事件绑定 =====
            function handleJump(e) {
                if (e) e.preventDefault();
                // 只在游戏结束或空闲时响应点击/空格
                if (gameState === 'over') {
                    resetGame();
                    // 重置后立即开始
                    setTimeout(() => {
                        gameState = 'playing';
                        statusMsg.textContent = '🎮 飞行中...';
                    }, 50);
                    return;
                }
                jump();
            }

            // 键盘
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    handleJump(e);
                }
            });

            // 鼠标点击画布
            canvas.addEventListener('click', handleJump);
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleJump(e);
            });

            // 按钮
            document.getElementById('startBtn').addEventListener('click', () => {
                if (gameState === 'idle') {
                    gameState = 'playing';
                    statusMsg.textContent = '🎮 飞行中...';
                } else if (gameState === 'over') {
                    resetGame();
                    setTimeout(() => {
                        gameState = 'playing';
                        statusMsg.textContent = '🎮 飞行中...';
                    }, 50);
                }
            });

            document.getElementById('resetBtn').addEventListener('click', resetGame);

            // ===== roundRect 辅助 =====
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    this.closePath();
                    return this;
                };
            }

            // ===== 启动 =====
            resetGame();
            gameLoop();

            // ===== 窗口失焦时减少性能消耗 =====
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    // 暂停逻辑可加
                }
            });
        })();
    </script>

</body>

</html>
