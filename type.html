<!DOCTYPE html>
<html lang="zh-CN" data-theme="green">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TypeRush · 打字速度测试</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" data-theme-icon />
    <script src="assets/theme.js"></script>
    <style>


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-body);
            background-image: radial-gradient(circle at 20% 30%, #13171f 0%, #080a0e 90%);
            min-height: 100vh;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--primary-border);
            border-radius: 2.5rem;
            padding: 2.2rem 2.5rem;
            max-width: 820px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s;
        }

        .glass-card:hover {
            border-color: var(--primary-border-hover);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header h1 i {
            color: var(--primary);
            margin-right: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.3rem 1rem;
            border: 1px solid var(--primary-border);
            border-radius: 30px;
            transition: 0.2s;
        }

        .back-link:hover {
            background: rgba(var(--primary-rgb), 0.06);
            border-color: var(--primary);
        }

        .mode-switcher {
            display: flex;
            gap: 0.3rem;
            background: var(--bg-input);
            border-radius: 30px;
            padding: 0.2rem;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            padding: 0.2rem 0.9rem;
            border: none;
            border-radius: 30px;
            background: transparent;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: var(--primary);
            color: #0b0f18;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .mode-btn:hover:not(.active) {
            color: var(--text-accent);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .stat-item {
            background: var(--bg-input);
            padding: 0.6rem 0.2rem;
            border-radius: 1.2rem;
            border: 1px solid var(--border-color);
        }

        .stat-item .number {
            font-size: 1.6rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-accent);
        }

        .stat-item .label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-display {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 1.2rem;
            padding: 1.5rem 1.8rem;
            min-height: 130px;
            max-height: 260px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
            font-size: 1.2rem;
            line-height: 2.2rem;
            letter-spacing: 0.5px;
            margin-bottom: 0.8rem;
            user-select: none;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
            cursor: pointer;
        }

        .text-display.mode-cn {
            word-break: break-all;
            font-family: 'Noto Sans SC', 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            line-height: 2.4rem;
        }

        .text-display::-webkit-scrollbar {
            width: 4px;
        }

        .text-display::-webkit-scrollbar-track {
            background: transparent;
        }

        .text-display::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 12px;
        }

        .text-display .char {
            transition: color 0.05s;
            display: inline;
            white-space: pre-wrap;
        }

        .text-display .char.correct {
            color: var(--correct-color);
        }

        .text-display .char.incorrect {
            color: var(--incorrect-color);
            background: rgba(255, 80, 80, 0.15);
            border-radius: 4px;
        }

        .text-display .char.current {
            border-left: 2px solid var(--primary);
            animation: blink 1s step-end infinite;
            padding-left: 1px;
        }

        @keyframes blink {

            0%,
            100% {
                border-color: var(--primary);
            }

            50% {
                border-color: transparent;
            }
        }

        .text-display .char.pending {
            color: var(--text-muted);
        }

        #typeInput {
            width: 100%;
            padding: 0.7rem 1.2rem;
            border-radius: 1.2rem;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 0.8rem;
            -webkit-appearance: none;
            appearance: none;
        }

        #typeInput:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        #typeInput::placeholder {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls .btn {
            padding: 0.6rem 1.6rem;
            border-radius: 30px;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(var(--primary-rgb), 0.04);
            border-color: var(--primary);
        }

        /* ===== 结果弹窗（含名字输入） ===== */
        .result-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .result-overlay.show {
            display: flex;
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--primary-border);
            border-radius: 2.5rem;
            padding: 2.5rem 3rem;
            max-width: 440px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
        }

        .result-card h2 {
            font-size: 1.8rem;
            color: var(--text-accent);
            margin-bottom: 0.3rem;
        }

        .result-card .big-number {
            font-size: 4rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary-light);
            line-height: 1;
        }

        .result-card .big-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .result-card .sub-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1rem 0 1rem;
        }

        .result-card .sub-stats div {
            text-align: center;
        }

        .result-card .sub-stats .num {
            font-size: 1.2rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-accent);
        }

        .result-card .sub-stats .lbl {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* 名字输入区域 */
        .name-input-area {
            margin: 1rem 0 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .name-input-area label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .name-input-area .input-row {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .name-input-area input {
            flex: 1;
            min-width: 140px;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
            text-align: center;
        }

        .name-input-area input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .result-card .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .result-card .btn {
            padding: 0.6rem 1.8rem;
            border-radius: 30px;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .result-card .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .result-card .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .result-card .btn-secondary {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .result-card .btn-secondary:hover {
            background: rgba(var(--primary-rgb), 0.04);
        }

        .result-card .btn-success {
            background: rgba(0, 200, 100, 0.15);
            color: var(--correct-color);
            border: 1px solid rgba(0, 200, 100, 0.15);
        }

        .result-card .btn-success:hover {
            background: rgba(0, 200, 100, 0.25);
        }

        .result-card .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 提交状态 */
        .submit-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 0.3rem;
            min-height: 1.2rem;
        }

        .submit-status.success {
            color: var(--correct-color);
        }

        .submit-status.error {
            color: var(--incorrect-color);
        }

        @media (max-width: 600px) {
            .glass-card {
                padding: 1.5rem 1rem;
                border-radius: 1.8rem;
            }

            .stats {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.4rem;
            }

            .stat-item .number {
                font-size: 1.2rem;
            }

            .text-display {
                font-size: 0.95rem;
                padding: 1rem;
                line-height: 1.8rem;
                min-height: 100px;
                max-height: 180px;
            }

            .text-display.mode-cn {
                font-size: 0.9rem;
                line-height: 2rem;
            }

            .result-card {
                padding: 1.8rem 1.2rem;
            }

            .result-card .big-number {
                font-size: 3rem;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }

            .header .back-link {
                align-self: flex-end;
            }

            .header-right {
                justify-content: space-between;
            }

            #typeInput {
                font-size: 0.85rem;
                padding: 0.5rem 1rem;
            }

            .name-input-area .input-row {
                flex-direction: column;
            }

            .name-input-area input {
                min-width: unset;
                width: 100%;
            }
        }

        @media (max-width: 400px) {
            .text-display {
                font-size: 0.8rem;
                line-height: 1.6rem;
                padding: 0.8rem;
                min-height: 80px;
                max-height: 150px;
            }

            .text-display.mode-cn {
                font-size: 0.75rem;
                line-height: 1.8rem;
            }

            .stats {
                gap: 0.2rem;
            }

            .stat-item .number {
                font-size: 1rem;
            }

            .controls .btn {
                padding: 0.4rem 1rem;
                font-size: 0.75rem;
            }

            .mode-btn {
                font-size: 0.55rem;
                padding: 0.15rem 0.6rem;
            }
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <div class="header">
            <h1><i class="fas fa-keyboard"></i> TypeRush</h1>
            <div class="header-right">
        <div data-theme-switcher></div>
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回</a>
            </div>
        </div>

        <div
            style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
            <div class="mode-switcher">
                <button class="mode-btn active" data-mode="cn" id="modeCn">🇨🇳 中文</button>
                <button class="mode-btn" data-mode="en" id="modeEn">🇬🇧 英文</button>
            </div>
            <span style="font-size:0.6rem;color:var(--text-muted);font-family:'JetBrains Mono',monospace;"
                id="modeHint">中文模式 · 按空格开始</span>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="number" id="wpm">0</div>
                <div class="label">WPM</div>
            </div>
            <div class="stat-item">
                <div class="number" id="accuracy">100%</div>
                <div class="label">正确率</div>
            </div>
            <div class="stat-item">
                <div class="number" id="charCount">0/0</div>
                <div class="label">字符</div>
            </div>
            <div class="stat-item">
                <div class="number" id="timer">60</div>
                <div class="label">倒计时</div>
            </div>
        </div>

        <div class="text-display" id="textDisplay" tabindex="0"></div>

        <input type="text" id="typeInput" autofocus placeholder="点击这里开始打字 ⌨️" />

        <div class="controls">
            <button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> 开始</button>
            <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-rotate"></i> 重置</button>
            <button class="btn btn-secondary" id="newTextBtn"><i class="fas fa-file"></i> 换一段</button>
        </div>
    </div>

    <!-- ===== 结果弹窗 ===== -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
            <h2>🏁 测试完成</h2>
            <div class="big-number" id="finalWpm">0</div>
            <div class="big-label">WPM</div>
            <div class="sub-stats">
                <div>
                    <div class="num" id="finalAccuracy">100%</div>
                    <div class="lbl">正确率</div>
                </div>
                <div>
                    <div class="num" id="finalChars">0</div>
                    <div class="lbl">正确字符</div>
                </div>
                <div>
                    <div class="num" id="finalTime">0s</div>
                    <div class="lbl">用时</div>
                </div>
            </div>

            <!-- 名字输入区域 -->
            <div class="name-input-area">
                <label><i class="fas fa-user"></i> 输入你的名字提交成绩</label>
                <div class="input-row">
                    <input type="text" id="playerNameInput" placeholder="输入名字..." maxlength="20" />
                    <button class="btn btn-success" id="submitScoreBtn"><i class="fas fa-paper-plane"></i> 提交</button>
                </div>
                <div class="submit-status" id="submitStatus">输入名字后点击提交</div>
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" id="retryBtn"><i class="fas fa-redo"></i> 再来一次</button>
                <button class="btn btn-secondary" id="skipBtn">跳过</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 打字逻辑 =====
        (function () {
            // ---------- 词库 ----------
            const TEXTS_EN = [
                "The quick brown fox jumps over the lazy dog.",
                "Programming is the art of telling another human what you want the computer to do.",
                "Simplicity is the soul of efficiency.",
                "Code is like poetry. It should be clean and elegant.",
                "The only way to learn a new programming language is by writing programs in it.",
                "First, solve the problem. Then, write the code.",
                "Good code is its own best documentation.",
                "Make it work, make it right, make it fast.",
                "Debugging is twice as hard as writing the code in the first place.",
                "Talk is cheap. Show me the code.",
                "Any fool can write code that a computer can understand. Good programmers write code that humans can understand."
            ];

            const TEXTS_CN = [
                "任何傻瓜都能写出计算机能理解的代码。优秀的程序员写出人能理解的代码。",
                "保持简单，保持愚蠢。不要重复自己。",
                "程序必须为人类阅读而编写，只是顺便让机器执行。",
                "好的设计是显而易见的，伟大的设计是隐形的。",
                "简单是可靠的先决条件。代码是写给人看的。",
                "先让它工作，再让它正确，最后让它更快。",
                "最有效的调试工具是仔细思考。",
                "复杂性是万恶之源。预见变化并拥抱它。",
                "创造力是聪明地玩耍。不要重复自己。",
                "完美不是没有东西可加，而是没有东西可减。",
                "设计不只是它看起来怎样，还在于它怎样工作。",
                "好的代码本身就是最好的文档。"
            ];

            // ---------- DOM ----------
            const textDisplay = document.getElementById('textDisplay');
            const typeInput = document.getElementById('typeInput');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const newTextBtn = document.getElementById('newTextBtn');
            const retryBtn = document.getElementById('retryBtn');
            const skipBtn = document.getElementById('skipBtn');
            const submitScoreBtn = document.getElementById('submitScoreBtn');
            const playerNameInput = document.getElementById('playerNameInput');
            const submitStatus = document.getElementById('submitStatus');
            const modeCn = document.getElementById('modeCn');
            const modeEn = document.getElementById('modeEn');
            const modeHint = document.getElementById('modeHint');

            const wpmEl = document.getElementById('wpm');
            const accuracyEl = document.getElementById('accuracy');
            const charCountEl = document.getElementById('charCount');
            const timerEl = document.getElementById('timer');

            const resultOverlay = document.getElementById('resultOverlay');
            const finalWpm = document.getElementById('finalWpm');
            const finalAccuracy = document.getElementById('finalAccuracy');
            const finalChars = document.getElementById('finalChars');
            const finalTime = document.getElementById('finalTime');

            // ---------- 状态 ----------
            let currentMode = localStorage.getItem('typing_mode') || 'cn';
            let currentText = '';
            let chars = [];
            let currentIndex = 0;
            let isRunning = false;
            let isFinished = false;
            let timerInterval = null;
            let timeLeft = 60;
            let totalTyped = 0;
            let correctTyped = 0;
            let incorrectTyped = 0;
            let timerStarted = false;
            let isSubmitting = false;
            let hasSubmitted = false;
            let testResults = { wpm: 0, acc: 0, correct: 0, total: 0, elapsed: 0 };

            // ---------- 模式切换 ----------
            function setMode(mode) {
                currentMode = mode;
                localStorage.setItem('typing_mode', mode);
                modeCn.classList.toggle('active', mode === 'cn');
                modeEn.classList.toggle('active', mode === 'en');
                textDisplay.classList.toggle('mode-cn', mode === 'cn');
                modeHint.textContent = mode === 'cn' ? '中文模式 · 按空格开始' : '英文模式 · 按空格开始';
                loadText(pickRandomText());
                typeInput.focus();
            }

            function pickRandomText() {
                const texts = currentMode === 'cn' ? TEXTS_CN : TEXTS_EN;
                return texts[Math.floor(Math.random() * texts.length)];
            }

            // ---------- 核心函数 ----------
            function resetState() {
                stopTimer();
                isRunning = false;
                isFinished = false;
                timerStarted = false;
                timeLeft = 60;
                totalTyped = 0;
                correctTyped = 0;
                incorrectTyped = 0;
                currentIndex = 0;
                hasSubmitted = false;
                isSubmitting = false;
                timerEl.textContent = '60';
                resultOverlay.classList.remove('show');
                submitStatus.textContent = '输入名字后点击提交';
                submitStatus.className = 'submit-status';
                submitScoreBtn.disabled = false;
                submitScoreBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交';
                updateStats();
            }

            function loadText(text) {
                resetState();
                currentText = text;
                chars = text.split('').map(char => ({ char, status: 'pending' }));
                if (chars.length > 0) chars[0].status = 'current';
                renderText();
                typeInput.value = '';
                typeInput.disabled = true;
                typeInput.placeholder = '点击 "开始" 后打字 ⌨️';
                textDisplay.focus();
            }

            function renderText() {
                let html = '';
                chars.forEach((c, i) => {
                    let cls = 'char';
                    if (c.status === 'correct') cls += ' correct';
                    else if (c.status === 'incorrect') cls += ' incorrect';
                    else if (c.status === 'current') cls += ' current';
                    else cls += ' pending';
                    const displayChar = c.char === ' ' ? '&nbsp;' : escapeHtml(c.char);
                    html += `<span class="${cls}" data-index="${i}">${displayChar}</span>`;
                });
                textDisplay.innerHTML = html;
                const currentEl = textDisplay.querySelector('.char.current');
                if (currentEl) {
                    currentEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
                }
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ---------- 提交排名 ----------
            async function submitRanking(playerName) {
                if (isSubmitting || hasSubmitted) return;
                isSubmitting = true;
                submitScoreBtn.disabled = true;
                submitScoreBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';
                submitStatus.textContent = '⏳ 提交中...';
                submitStatus.className = 'submit-status';

                const { wpm, acc, total, correct, elapsed } = testResults;

                if (total === 0 || wpm === 0) {
                    submitStatus.textContent = '⚠️ 无有效成绩';
                    submitStatus.className = 'submit-status error';
                    isSubmitting = false;
                    submitScoreBtn.disabled = false;
                    submitScoreBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交';
                    return;
                }

                try {
                    const resp = await fetch('https://api.eggfish.dpdns.org/api/rankings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            player_name: playerName.trim(),
                            wpm: wpm,
                            accuracy: acc,
                            total_chars: total,
                            correct_chars: correct,
                            wrong_chars: total - correct,
                            time_used: elapsed,
                            mode: '60s'
                        })
                    });

                    if (resp.ok) {
                        const data = await resp.json();
                        submitStatus.textContent = '✅ 成绩已提交！';
                        submitStatus.className = 'submit-status success';
                        hasSubmitted = true;
                        submitScoreBtn.disabled = true;
                        submitScoreBtn.innerHTML = '<i class="fas fa-check"></i> 已提交';
                        // 保存名字
                        localStorage.setItem('typing_name', playerName.trim());
                        console.log('🏆 排名提交成功！', data);
                    } else {
                        const err = await resp.text();
                        submitStatus.textContent = '⚠️ 提交失败: ' + err;
                        submitStatus.className = 'submit-status error';
                        isSubmitting = false;
                        submitScoreBtn.disabled = false;
                        submitScoreBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 重试';
                    }
                } catch (error) {
                    console.warn('❌ 提交排名网络错误:', error);
                    submitStatus.textContent = '⚠️ 网络错误，请重试';
                    submitStatus.className = 'submit-status error';
                    isSubmitting = false;
                    submitScoreBtn.disabled = false;
                    submitScoreBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 重试';
                }
            }

            // ---------- 按键处理 ----------
            function handleKey(e) {
                if (isFinished) return;
                if (!isRunning) {
                    startTimer();
                    isRunning = true;
                    typeInput.disabled = false;
                    typeInput.placeholder = '打字中...';
                    timerStarted = true;
                    typeInput.focus();
                }

                const key = e.key;
                if (key === 'Tab') { e.preventDefault(); return; }

                if (key.length === 1 || key === 'Backspace') {
                    e.preventDefault();

                    if (key === 'Backspace') {
                        if (currentIndex > 0) {
                            currentIndex--;
                            const prev = chars[currentIndex];
                            if (prev.status === 'correct') correctTyped--;
                            else if (prev.status === 'incorrect') incorrectTyped--;
                            prev.status = 'current';
                            for (let i = currentIndex + 1; i < chars.length; i++) {
                                if (chars[i].status === 'correct' || chars[i].status === 'incorrect') {
                                    chars[i].status = 'pending';
                                }
                            }
                            totalTyped = correctTyped + incorrectTyped;
                            renderText();
                            updateStats();
                        }
                        return;
                    }

                    if (currentIndex >= chars.length) { finishTest(); return; }

                    const expected = chars[currentIndex].char;
                    const typed = key;

                    if (typed === expected) {
                        chars[currentIndex].status = 'correct';
                        correctTyped++;
                    } else {
                        chars[currentIndex].status = 'incorrect';
                        incorrectTyped++;
                    }
                    totalTyped = correctTyped + incorrectTyped;
                    currentIndex++;

                    if (currentIndex < chars.length) chars[currentIndex].status = 'current';

                    renderText();
                    updateStats();

                    if (currentIndex >= chars.length) finishTest();
                }
            }

            // ---------- 计时器 ----------
            function startTimer() {
                if (timerInterval) return;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    timerEl.textContent = timeLeft;
                    updateWPM();
                    if (timeLeft <= 0) finishTest();
                }, 1000);
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            function updateWPM() {
                const elapsed = (60 - timeLeft) / 60;
                wpmEl.textContent = elapsed > 0 ? Math.round((correctTyped / 5) / elapsed) : 0;
            }

            function updateStats() {
                const total = correctTyped + incorrectTyped;
                const acc = total > 0 ? Math.round((correctTyped / total) * 100) : 100;
                accuracyEl.textContent = acc + '%';
                charCountEl.textContent = `${total}/${chars.length}`;
                updateWPM();
            }

            // ---------- 结束 ----------
            function finishTest() {
                if (isFinished) return;
                isFinished = true;
                isRunning = false;
                stopTimer();
                typeInput.disabled = true;
                typeInput.placeholder = '测试已结束';

                const elapsed = 60 - timeLeft;
                const minutes = elapsed / 60;
                const wpm = minutes > 0 ? Math.round((correctTyped / 5) / minutes) : 0;
                const acc = totalTyped > 0 ? Math.round((correctTyped / totalTyped) * 100) : 0;

                // 保存结果供提交使用
                testResults = {
                    wpm: wpm,
                    acc: acc,
                    total: totalTyped,
                    correct: correctTyped,
                    elapsed: elapsed
                };

                finalWpm.textContent = wpm;
                finalAccuracy.textContent = acc + '%';
                finalChars.textContent = correctTyped;
                finalTime.textContent = elapsed + 's';

                // 自动填入上次保存的名字
                const savedName = localStorage.getItem('typing_name') || '';
                playerNameInput.value = savedName;

                // 重置提交状态
                hasSubmitted = false;
                isSubmitting = false;
                submitScoreBtn.disabled = false;
                submitScoreBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交';
                submitStatus.textContent = savedName ? '输入名字后点击提交' : '输入名字后点击提交';
                submitStatus.className = 'submit-status';

                // 显示弹窗
                resultOverlay.classList.add('show');

                // 聚焦到名字输入框
                setTimeout(() => {
                    playerNameInput.focus();
                    playerNameInput.select();
                }, 400);
            }

            // ---------- 事件绑定 ----------
            // 提交按钮
            submitScoreBtn.addEventListener('click', function () {
                const name = playerNameInput.value.trim();
                if (!name) {
                    submitStatus.textContent = '⚠️ 请输入名字';
                    submitStatus.className = 'submit-status error';
                    playerNameInput.focus();
                    return;
                }
                if (hasSubmitted) {
                    submitStatus.textContent = '✅ 已提交，无需重复提交';
                    submitStatus.className = 'submit-status success';
                    return;
                }
                submitRanking(name);
            });

            // 回车提交
            playerNameInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitScoreBtn.click();
                }
            });

            // 跳过按钮
            skipBtn.addEventListener('click', function () {
                resultOverlay.classList.remove('show');
                loadText(pickRandomText());
                typeInput.disabled = false;
                typeInput.placeholder = '点击 "开始" 后打字 ⌨️';
                typeInput.focus();
            });

            textDisplay.addEventListener('click', () => {
                if (!isRunning && !isFinished) {
                    typeInput.focus();
                    typeInput.placeholder = '点击 "开始" 后打字 ⌨️';
                } else if (isRunning && !isFinished) {
                    typeInput.focus();
                }
            });

            // 手机适配：清空输入框
            typeInput.addEventListener('focus', function () {
                if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                    this.value = '';
                }
            });

            typeInput.addEventListener('input', function (e) {
                this.value = '';
            });

            typeInput.addEventListener('keydown', handleKey);
            typeInput.addEventListener('blur', () => {
                if (isRunning && !isFinished) {
                    setTimeout(() => typeInput.focus(), 100);
                }
            });

            startBtn.addEventListener('click', () => {
                if (isRunning) return;
                typeInput.disabled = false;
                typeInput.placeholder = '打字中...';
                typeInput.focus();
                if (!timerStarted) {
                    startTimer();
                    isRunning = true;
                    timerStarted = true;
                } else {
                    isRunning = true;
                }
            });

            resetBtn.addEventListener('click', () => {
                resultOverlay.classList.remove('show');
                loadText(currentText);
                typeInput.disabled = false;
                typeInput.placeholder = '点击 "开始" 后打字 ⌨️';
                typeInput.focus();
            });

            newTextBtn.addEventListener('click', () => {
                resultOverlay.classList.remove('show');
                loadText(pickRandomText());
                typeInput.disabled = false;
                typeInput.placeholder = '点击 "开始" 后打字 ⌨️';
                typeInput.focus();
            });

            retryBtn.addEventListener('click', () => {
                resultOverlay.classList.remove('show');
                loadText(pickRandomText());
                typeInput.disabled = false;
                typeInput.placeholder = '点击 "开始" 后打字 ⌨️';
                typeInput.focus();
            });

            // ===== 模式切换事件 =====
            modeCn.addEventListener('click', () => setMode('cn'));
            modeEn.addEventListener('click', () => setMode('en'));

            // ===== 启动 =====
            const savedMode = localStorage.getItem('typing_mode') || 'cn';
            if (savedMode === 'cn') {
                modeCn.classList.add('active');
                modeEn.classList.remove('active');
                textDisplay.classList.add('mode-cn');
                modeHint.textContent = '中文模式 · 按空格开始';
            } else {
                modeEn.classList.add('active');
                modeCn.classList.remove('active');
                textDisplay.classList.remove('mode-cn');
                modeHint.textContent = '英文模式 · 按空格开始';
            }
            currentMode = savedMode;

            loadText(pickRandomText());
            typeInput.focus();

            document.querySelector('.glass-card').addEventListener('click', (e) => {
                if (e.target.closest('.controls') || e.target.closest('.header') ||
                    e.target.closest('.result-overlay') || e.target.closest('.mode-switcher')) return;
                if (isRunning && !isFinished) {
                    typeInput.focus();
                }
            });

        })();
    </script>

</body>
